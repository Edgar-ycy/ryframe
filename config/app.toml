# ============================================================
# RyFrame 默认配置
# 此文件包含所有配置项的默认值，由环境配置文件覆盖
# ============================================================

[app]
name = "ryframe"
host = "0.0.0.0"
port = 8080

[multi_tenancy]
# 多租户总开关。关闭后不再接受客户端选择租户，所有身份入口固定使用内置 system 租户；
# 数据库 tenant_id 隔离列、唯一键和缓存命名空间仍然保留。
enabled = true

[tenant_data]
# 新租户默认 placement；已有租户始终以控制库权威 placement 为准，缺失时拒绝路由。
default_target = "shared-control"
max_open_targets = 32
max_total_connections = 200
idle_pool_secs = 600
# shared-control 可省略并由规范化阶段注入；显式形式如下：
# [[tenant_data.targets]]
# key = "shared-control"
# mode = "shared"
# kind = "control"
# 独立 MySQL 目标只保存密码环境变量名，不允许配置明文密码或 DSN。
# [[tenant_data.targets]]
# key = "tenant-a-db"
# display_name = "租户 A 独立库"
# region = "cn-east-1"
# mode = "dedicated"
# kind = "mysql"
# max_connections = 8
# host = "mysql-tenant-a.internal"
# port = 3306
# database = "ryframe_tenant_a"
# username = "ryframe_tenant_a"
# password_env = "RYFRAME_TENANT_A_DB_PASSWORD"
# tls_mode = "verify_identity"
# tls_ca = "/run/secrets/mysql-ca.pem"

[api_docs]
enabled = true

[monitor]
# 生产环境必须注入至少 32 字节的随机值。
metrics_bearer_token = ""

[database]
# SQL 日志模式: off(关闭) / slow(仅慢 SQL) / summary(摘要) / full(完整参数化 SQL)
sql_log_level = "off"
# 慢 SQL 判定阈值（毫秒）。
sql_slow_threshold_ms = 200
# 未设置时，开发/测试环境的 migration_mode 默认为 auto，生产环境默认为 verify。
# 生产控制面 DDL 应由独立的 `ryframe-migrate control up` 部署任务执行；
# 租户数据面另执行 `ryframe-migrate tenant-data up --all`。

[database.primary]
host = "localhost"
port = 3306
database = "ryframe_config"
username = "root"
password = ""
max_connections = 10
min_connections = 1
# 默认要求加密连接；远程生产数据库必须进一步使用 verify_identity。
tls_mode = "required"
# MySQL TLS CA 证书路径示例：tls_ca = "/run/secrets/mysql-ca.pem"
# MySQL TLS 客户端证书路径示例：tls_client_cert = "/run/secrets/mysql-client.pem"
# MySQL TLS 客户端私钥路径示例：tls_client_key = "/run/secrets/mysql-client.key"

[generator]
# 读取表结构的数据源名称；默认使用 primary。
data_source = "primary"

[auth]
jwt_secret = "change-me-in-production"
access_token_expire = "1h"
refresh_token_expire = "168h"

[redis]
mode = "optional"
host = "127.0.0.1"
port = 6379
password = ""
database = 0
max_pool_size = 16
timeout_secs = 3
tls = false
# Redis TLS CA 证书路径示例：tls_ca = "/run/secrets/redis-ca.pem"
# Redis TLS 客户端证书路径示例：tls_client_cert = "/run/secrets/redis-client.pem"
# Redis TLS 客户端私钥路径示例：tls_client_key = "/run/secrets/redis-client.key"

[logger]
level = "info"
format = "text"
output = "stdout"
retention_days = 7

[telemetry]
# OTLP 导出失败只会降级为本地日志，不会影响应用就绪状态。
enabled = false
endpoint = "http://localhost:4318/v1/traces"
service_name = "ryframe"
sample_ratio = 0.1
export_timeout_secs = 5
max_queue_size = 2048

[messaging]
# 消息收件箱、发布、WebSocket 票据和实时投递的总开关。
enabled = true
# 一次性 WebSocket 票据有效期（秒）。
ticket_ttl_seconds = 60
# 消息最大保留天数。
retention_days = 90
# 每个租户用户在单个 API 实例上的最大 WebSocket 连接数。
max_connections_per_user = 5
# 每条 WebSocket 连接的有界出站队列容量。
outbound_buffer = 256
# 单条消息允许固化的最大收件人数。
max_recipients_per_message = 100000
# 共享补拉调度器扫描在线身份的间隔（秒）
replay_interval_seconds = 15
# 多实例共享补拉调度器的启动抖动上限（秒）
replay_jitter_seconds = 5
# 单个租户用户每次补拉的最大消息数
replay_batch_size = 100

[cors]
# 允许来源示例：allow_origins = ["https://admin.example.com"]
allow_origins = []

[proxy]
# 仅信任显式列出的反向代理发送的转发请求头。
# 可信代理 CIDR 示例：trusted_cidrs = []
trusted_cidrs = [
    "127.0.0.1/32",
    "::1/128",
]
[upload]
# 文件大小限制不包含预留的少量 multipart 信封开销。
file_max_bytes = 10485760
avatar_max_bytes = 5242880
multipart_envelope_bytes = 65536
upload_timeout_seconds = 120
api_timeout_seconds = 30

[rate_limit]
# 是否启用全局限流
enabled = true
# 每个窗口允许的最大请求数
capacity = 100
# 固定窗口时长（秒）
window_secs = 60
# ========== 用户级限流 ==========
# 是否启用用户级限流（需 Redis + 在 system_router 添加中间件）
enable_user_rate_limit = false
# 用户级窗口时长（秒）
user_window_secs = 60
# 每用户每窗口最大请求数
user_capacity = 500
# ========== 接口级限流 ==========
# 敏感接口限流：METHOD /path = 每窗口最大请求数
# 示例：{"POST /api/v1/auth/login" = 5} 表示登录接口每分钟最多 5 次
[rate_limit.api_limits]
"POST /api/v1/auth/login" = 5
"POST /api/v1/auth/password-reset/complete" = 3
"GET /api/v1/auth/csrf" = 30
# 接口级窗口时长（秒）
api_window_secs = 60

[pagination]
# 省略 `page_size` 时按此策略取值；提供 page=0、page_size=0 或超过
# max_page_size 的 page_size 时，请求会以 400 被拒绝。
default_page_size = 10
max_page_size = 100

[jobs]
# 后台任务：开发环境由 Web 进程内置 Worker 消费；生产环境默认改为 external，
# 并由独立的 `ryframe-worker` 进程运行。
poll_interval_ms = 500
max_idle_poll_interval_ms = 5000
lease_seconds = 60
heartbeat_seconds = 15
lease_recovery_interval_seconds = 15
# 仅控制 Cron 计划扫描与管理能力；关闭后普通后台任务仍继续消费。
scheduler_enabled = true
scheduler_poll_interval_ms = 1000
scheduler_batch_size = 100
max_enabled_schedules_per_tenant = 100
default_max_attempts = 8
export_max_rows = 500000
export_retention_hours = 24
concurrency = 4
# 独立 `ryframe-worker` 的存活、就绪和 Prometheus 指标端口。
health_host = "0.0.0.0"
health_port = 9091
# 嵌入模式示例：mode = "embedded"
# 工作进程 ID 示例：worker_id = "worker-a"

[data_retention]
# 分级保留只清理明确进入成功或已发布终态的数据；后台任务和 Outbox 死信永久保留。
cleanup_batch_size = 500
max_rows_per_resource_per_run = 50000
background_job_succeeded_days = 30
outbox_published_days = 30
schedule_execution_days = 180
export_job_history_days = 180
operation_log_days = 180
login_log_days = 180
user_import_history_days = 180
user_import_artifact_hours = 168
retention_run_days = 730
service_access_audit_days = 180

[service_accounts]
# 开发基线默认关闭；启用后必须从外部只读文件加载独立于 JWT 的 Pepper Keyring。
enabled = false
pepper_keyring_file = ""
active_pepper_version = 1
max_active_credentials = 2
max_credential_days = 90
default_delegation_hours = 24
max_delegation_days = 30
default_requests_per_minute = 60
max_concurrent_queries = 4
query_timeout_ms = 3000
max_page_size = 100
max_response_bytes = 1048576

[user_import]
# 异步用户导入的文件、行数、批次与密码哈希并发上限。
max_file_bytes = 10485760
max_rows = 20000
batch_size = 100
max_active_per_tenant = 1
hash_parallelism = 2

[tenant_config_transfer]
# 配置包上传、解压、项目数、保留窗口、租约及后台任务运行上限。
max_package_bytes = 5242880
max_uncompressed_bytes = 20971520
max_items = 10000
artifact_hours = 168
rollback_hours = 168
lease_seconds = 300
max_runtime_seconds = 1800

[object_storage]
# 存储后端: local（本地）| rustfs（RustFS）| minio（MinIO）| s3（兼容 S3）
backend = "local"
# 本地存储根目录
local_base_dir = "uploads"
# 仅可在单副本或正确配置的共享卷场景中显式启用。
allow_local_in_production = false
# RustFS / MinIO / S3 端点
endpoint = ""
# 访问密钥（生产环境通过 APP_OBJECT_STORAGE_ACCESS_KEY_FILE 注入）
access_key = ""
# 私密访问密钥（生产环境通过 APP_OBJECT_STORAGE_SECRET_KEY_FILE 注入）
secret_key = ""
# 是否启用 TLS；生产远程存储必须为 true，且 endpoint 必须以 https:// 开头
use_ssl = false
# AWS 区域
region = "us-east-1"
