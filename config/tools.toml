# 开发工具配置；本机覆盖可写入忽略目录 .local-tests/tools.toml。
# 相对路径以此后端 Cargo Workspace 根目录为基准。
# 开发监督器的完整覆盖示例；复制到本机工具文件并按需取消注释，不改变公共默认值。
# [development]
# config_dir = ".local-tests/dev-config"
# verify_tenant_targets = ["shared-control"]

[workspace]
frontend_dir = "../ryframe-vue3"
# CI 前端仓库；本地运行 frontend-source 时显式设置，CI 缺省为当前 owner/ryframe-vue3。
# frontend_repository = "your-owner/ryframe-vue3"

[verification]
# Python 检查入口；相对路径以后端根目录解析，缺省从操作系统 PATH 选择 python。
# python_program = ".local-tests/python/Scripts/python.exe"
# Node 检查入口；相同路径规则，缺省从操作系统 PATH 选择 node。
# node_program = ".local-tests/node/node.exe"

[generator]
# 结构导入使用的应用配置目录；相对路径以后端工作区为基准。
# config_dir = "config"
# 创建自己的业务 crate 后设置 package，避免每次在命令行重复传入。
# package = "order-business"
# source = "sources.legacy"
# storage = "tenant"
# tables = ["biz_order", "biz_order_item"]
# strip_table_prefix = "biz_"
# models = ["Order", "OrderItem"]
# cargo generate -- run 按 tables 是否为空选择导入或模型生成；数组覆盖时整体替换。
# source 指定只读结构来源，storage 指定生成模型的运行时范围，两者可以不同。
# source 可用 primary、sources.<名称> 或 tenant_data.targets.<目标键>。
sync_frontend = false
