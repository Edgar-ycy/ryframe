# CI 固定应用值；运行身份、目录和健康端口由正式命令派生。
scope_id = "ci-template"
snowflake_worker_id = 3

[bootstrap]
admin_password = "Valid!Admin123"
[app]
host = "127.0.0.1"
port = 8080
[multi_tenancy]
enabled = true
[api_docs]
enabled = false
[monitor]
metrics_bearer_token = "ryframe-ci-isolated-metrics-token-more-than-thirty-two-bytes"
[database.primary]
host = "127.0.0.1"
port = 3306
database = "ryframe_e2e_template"
username = "root"
password = "ryframe-ci-password"
tls_mode = "disabled"
[redis]
mode = "required"
host = "127.0.0.1"
port = 6379
password = ""
database = 14
tls = false
[object_storage]
backend = "s3"
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key = "ryframe-ci-access"
secret_key = "ryframe-ci-isolated-storage-secret"
use_ssl = false
local_base_dir = "storage"
[auth]
jwt_secret = "ryframe-ci-only-jwt-secret-with-more-than-thirty-two-bytes"
[cors]
allow_origins = ["http://127.0.0.1:4174"]
[jobs]
mode = "external"
health_host = "127.0.0.1"
health_port = 19210
[rate_limit]
enabled = true
capacity = 100
window_secs = 60
api_window_secs = 60
[rate_limit.api_limits]
"POST /api/v1/auth/login" = 5
"POST /api/v1/auth/password-reset/complete" = 3
"GET /api/v1/auth/csrf" = 30
[reset]
credential_version = "ci-v1"
legacy_mysql_exclusive = true
legacy_redis_exclusive = true
legacy_object_storage_exclusive = true
redis_outside_sentinel_key = "ryframe-ci-outside-sentinel"
services_stopped = true
source_sha = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
state_directory = "reset-state"
