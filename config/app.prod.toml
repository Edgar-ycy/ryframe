# 生产环境配置
# 数据库连接统一使用各自连接块中的显式 password 字段；其他敏感配置仍通过 APP_*_FILE
# 或部署平台环境变量注入，不把 Redis、对象存储和 JWT 密钥写入配置文件。

# 每个生产部署必须覆盖为自身稳定且唯一的资源作用域；该哨兵值无法通过生产校验。
scope_id = "replace-with-unique-scope"

[api_docs]
enabled = false

[database]
# 生产默认关闭 SQL 日志；仅在受控短时排障窗口临时启用。
sql_log_level = "off"
sql_slow_threshold_ms = 200

[cors]
allow_origins = [
    "https://ryframe.ryfac.com",
]

[logger]
level = "info"
format = "json"
output = "stdout"
retention_days = 7

[redis]
mode = "required"
host = "127.0.0.1"
port = 6379
max_pool_size = 32

[proxy]
# 默认假设 Nginx 通过回环地址连接；容器网络部署时必须改为实际代理 CIDR。
trusted_cidrs = ["127.0.0.1/32", "::1/128"]
