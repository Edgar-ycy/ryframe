# 生产环境配置
# 密码、JWT、监控令牌与对象存储凭据直接填写在本文件的对应字段中。
# 本样例保留安全占位值；部署前必须填写实际值并通过生产校验。
snowflake_worker_id = 1

# 每个生产部署必须覆盖为自身稳定且唯一的资源作用域；该哨兵值无法通过生产校验。
scope_id = "replace-with-unique-scope"

[bootstrap]
# 仅首次显式初始化需要填写；正常服务启动不要求保留该密码。
# admin_password = "请填写符合复杂度要求的管理员密码"

[api_docs]
enabled = false

[database]
# 生产默认关闭 SQL 日志；仅在受控短时排障窗口临时启用。
sql_log_level = "off"
sql_slow_threshold_ms = 200

[cors]
allow_origins = [
    "https://ryframe.ryfac.com",
]

[logger]
level = "info"
format = "json"
output = "stdout"
retention_days = 7

[redis]
mode = "required"
host = "127.0.0.1"
port = 6379
max_pool_size = 32

[proxy]
# 默认假设 Nginx 通过回环地址连接；容器网络部署时必须改为实际代理 CIDR。
trusted_cidrs = ["127.0.0.1/32", "::1/128"]
