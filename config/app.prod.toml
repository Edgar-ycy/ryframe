# 生产环境配置
# 敏感信息通过 APP_*_FILE 或部署平台的环境变量注入，不写入配置文件

[api_docs]
enabled = false

[cors]
allow_origins = [
    "https://ryframe.ryfac.com",
]

[logger]
level = "info"
format = "json"
output = "stdout"
retention_days = 7

[redis]
mode = "required"
host = "127.0.0.1"
port = 6379
max_pool_size = 32

[proxy]
# 默认假设 Nginx 通过回环地址连接；容器网络部署时必须改为实际代理 CIDR。
trusted_cidrs = ["127.0.0.1/32", "::1/128"]
