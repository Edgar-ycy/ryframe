# Qodana 配置说明：https://www.jetbrains.com/help/qodana/qodana-yaml.html
# 本文件会进入扫描报告，不得写入令牌、密码等敏感信息。
version: "1.0"

# 使用适用于 Rust 项目的官方检查器。
linter: qodana-rust

# 使用入门检查配置，后续可按项目基线逐步收紧。
profile:
  name: qodana.starter

exclude:
  # Cargo 支持通过“依赖名/Feature 名”转发 Feature，此处仅屏蔽 Qodana 对该清单的误报。
  - name: TomlUnresolvedReference
    paths:
      - crates/ryframe/Cargo.toml
