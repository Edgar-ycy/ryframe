services:
  mysql-primary:
    image: mysql:8.4
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
    environment:
      MYSQL_ROOT_PASSWORD: ryframe_test_password
      MYSQL_DATABASE: ryframe_test
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:${RYFRAME_V07_PRIMARY_PORT}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --log-error-verbosity=1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - mysql-primary-data:/var/lib/mysql

  mysql-replica:
    image: mysql:8.4
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
    environment:
      MYSQL_ROOT_PASSWORD: ryframe_test_password
      MYSQL_DATABASE: ryframe_test
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:${RYFRAME_V07_REPLICA_PORT}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --log-error-verbosity=1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - mysql-replica-data:/var/lib/mysql

volumes:
  mysql-primary-data:
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
  mysql-replica-data:
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"

networks:
  default:
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
