# RyFrame 的 cargo-deny 配置
# 执行命令：cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "bzip2-1.0.6",
]

[[licenses.clarify]]
# ring 由 rustls / jsonwebtoken 使用，且其许可证并非标准 SPDX 表达式。
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# 在依赖审查中保留重复版本的可见性，同时不阻断当前依赖上游收敛的安全升级。
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
