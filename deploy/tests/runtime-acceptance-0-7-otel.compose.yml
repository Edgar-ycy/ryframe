services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    user: "0:0"
    ports:
      - "127.0.0.1:${RYFRAME_V07_OTEL_HTTP_PORT:?}:4318"
      - "127.0.0.1:${RYFRAME_V07_OTEL_HEALTH_PORT:?}:13133"
    volumes:
      - type: bind
        source: ${RYFRAME_V07_OTEL_COLLECTOR_CONFIG:?}
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - otel-runtime-traces:/var/lib/otel
    restart: "no"

volumes:
  otel-runtime-traces:
    labels:
      com.ryframe.runtime-acceptance-owner: "${RYFRAME_V07_OWNERSHIP_TOKEN:?}"
