# RyFrame 生产环境持久化策略基线。
#
# 网络绑定、TLS 以及 ACL/密码设置取决于具体部署，必须由部署平台提供。
# Compose 测试栈仅在其隔离的 CI 网络中覆写 bind 和 protected-mode。

dir /data

# 刷新令牌族、撤销记录、幂等记录和分布式锁均属于安全状态，必须在 Redis
# 进程重启后仍然保留。
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# 安全状态绝不能为了给缓存条目腾出空间而被淘汰。
maxmemory-policy noeviction

# 保留定期快照，作为额外的恢复保障。
save 900 1
save 300 10
save 60 10000
