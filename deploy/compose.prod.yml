name: ryframe

x-ryframe-environment: &ryframe-environment
  APP_ENV: prod
  APP_JOBS_MODE: external
  APP_JOBS_LEASE_SECONDS: ${APP_JOBS_LEASE_SECONDS:-60}
  APP_JOBS_HEARTBEAT_SECONDS: ${APP_JOBS_HEARTBEAT_SECONDS:-15}
  APP_JOBS_DEFAULT_MAX_ATTEMPTS: ${APP_JOBS_DEFAULT_MAX_ATTEMPTS:-8}
  APP_JOBS_EXPORT_MAX_ROWS: ${APP_JOBS_EXPORT_MAX_ROWS:-500000}
  APP_JOBS_EXPORT_RETENTION_HOURS: ${APP_JOBS_EXPORT_RETENTION_HOURS:-24}
  APP_DATABASE_HOST: ${APP_DATABASE_HOST:?必须设置 APP_DATABASE_HOST}
  APP_DATABASE_PORT: ${APP_DATABASE_PORT:-3306}
  APP_DATABASE_NAME: ${APP_DATABASE_NAME:?必须设置 APP_DATABASE_NAME}
  APP_DATABASE_USERNAME: ${APP_DATABASE_USERNAME:?必须设置 APP_DATABASE_USERNAME}
  APP_DATABASE_PASSWORD_FILE: /run/secrets/database-password
  APP_DATABASE_REPLICAS_FILE: /run/secrets/database-replicas
  APP_DATABASE_SOURCES_FILE: /run/secrets/database-sources
  APP_DATABASE_TLS_MODE: verify_identity
  APP_DATABASE_TLS_CA: /run/secrets/mysql-ca.pem
  APP_DATABASE_TLS_CLIENT_CERT: /run/secrets/mysql-client-cert.pem
  APP_DATABASE_TLS_CLIENT_KEY: /run/secrets/mysql-client-key.pem
  APP_REDIS_MODE: required
  APP_REDIS_HOST: ${APP_REDIS_HOST:?必须设置 APP_REDIS_HOST}
  APP_REDIS_PORT: ${APP_REDIS_PORT:-6380}
  APP_REDIS_PASSWORD_FILE: /run/secrets/redis-password
  APP_REDIS_TLS: "true"
  APP_REDIS_TLS_CA: /run/secrets/redis-ca.pem
  APP_REDIS_TLS_CLIENT_CERT: /run/secrets/redis-client-cert.pem
  APP_REDIS_TLS_CLIENT_KEY: /run/secrets/redis-client-key.pem
  APP_OBJECT_STORAGE_BACKEND: s3
  APP_OBJECT_STORAGE_ENDPOINT: ${APP_OBJECT_STORAGE_ENDPOINT:?必须设置 APP_OBJECT_STORAGE_ENDPOINT}
  APP_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/object-storage-access-key
  APP_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/object-storage-secret-key
  APP_OBJECT_STORAGE_REGION: ${APP_OBJECT_STORAGE_REGION:-us-east-1}
  APP_OBJECT_STORAGE_USE_SSL: "true"
  APP_AUTH_JWT_SECRET_FILE: /run/secrets/auth-jwt-secret
  APP_MONITOR_METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics-bearer-token
  APP_PROXY_TRUSTED_CIDRS: ${APP_PROXY_TRUSTED_CIDRS:?必须设置受信任代理 CIDR}
  APP_LOGGER_LEVEL: ${APP_LOGGER_LEVEL:-info}
  APP_LOGGER_FORMAT: ${APP_LOGGER_FORMAT:-json}
  APP_LOGGER_OUTPUT: ${APP_LOGGER_OUTPUT:-stdout}
  APP_LOGGER_RETENTION_DAYS: ${APP_LOGGER_RETENTION_DAYS:-7}
  APP_MESSAGING_ENABLED: ${APP_MESSAGING_ENABLED:-true}
  APP_MESSAGING_TICKET_TTL_SECONDS: ${APP_MESSAGING_TICKET_TTL_SECONDS:-60}
  APP_MESSAGING_RETENTION_DAYS: ${APP_MESSAGING_RETENTION_DAYS:-90}
  APP_MESSAGING_MAX_CONNECTIONS_PER_USER: ${APP_MESSAGING_MAX_CONNECTIONS_PER_USER:-5}
  APP_MESSAGING_OUTBOUND_BUFFER: ${APP_MESSAGING_OUTBOUND_BUFFER:-256}
  APP_MESSAGING_MAX_RECIPIENTS_PER_MESSAGE: ${APP_MESSAGING_MAX_RECIPIENTS_PER_MESSAGE:-100000}
  APP_MESSAGING_REPLAY_INTERVAL_SECONDS: ${APP_MESSAGING_REPLAY_INTERVAL_SECONDS:-15}
  APP_MESSAGING_REPLAY_JITTER_SECONDS: ${APP_MESSAGING_REPLAY_JITTER_SECONDS:-5}
  APP_MESSAGING_REPLAY_BATCH_SIZE: ${APP_MESSAGING_REPLAY_BATCH_SIZE:-100}
  APP_TELEMETRY_ENABLED: ${APP_TELEMETRY_ENABLED:-false}
  APP_TELEMETRY_ENDPOINT: ${APP_TELEMETRY_ENDPOINT:-http://otel-collector.internal.example:4318/v1/traces}
  APP_TELEMETRY_SERVICE_NAME: ${APP_TELEMETRY_SERVICE_NAME:-ryframe}
  APP_TELEMETRY_SAMPLE_RATIO: ${APP_TELEMETRY_SAMPLE_RATIO:-0.1}
  APP_TELEMETRY_EXPORT_TIMEOUT_SECS: ${APP_TELEMETRY_EXPORT_TIMEOUT_SECS:-5}
  APP_TELEMETRY_MAX_QUEUE_SIZE: ${APP_TELEMETRY_MAX_QUEUE_SIZE:-2048}

x-ryframe-service: &ryframe-service
  image: ${RYFRAME_IMAGE:?必须设置不可变的 RYFRAME_IMAGE 镜像摘要}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777,noexec,nosuid,size=64m
  environment: *ryframe-environment
  secrets:
    - mysql-ca.pem
    - mysql-client-cert.pem
    - mysql-client-key.pem
    - redis-ca.pem
    - redis-client-cert.pem
    - redis-client-key.pem
    - redis-password
    - database-password
    - database-replicas
    - database-sources
    - object-storage-access-key
    - object-storage-secret-key
    - auth-jwt-secret
    - metrics-bearer-token
  networks:
    - backend

services:
  migrate:
    <<: *ryframe-service
    restart: "no"
    entrypoint: ["/usr/local/bin/ryframe-migrate"]
    command: ["up"]
    environment:
      <<: *ryframe-environment
      APP_DATABASE_MIGRATION_MODE: off

  api:
    <<: *ryframe-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    environment:
      <<: *ryframe-environment
      APP_DATABASE_MIGRATION_MODE: verify
      SNOWFLAKE_WORKER_ID: ${RYFRAME_API_SNOWFLAKE_WORKER_ID:?必须设置唯一 API Snowflake 节点号}
    ports:
      - "127.0.0.1:${RYFRAME_API_PORT:-8080}:8080"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *ryframe-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/ryframe-worker"]
    environment:
      <<: *ryframe-environment
      APP_DATABASE_MIGRATION_MODE: verify
      SNOWFLAKE_WORKER_ID: ${RYFRAME_WORKER_SNOWFLAKE_WORKER_ID:?必须设置唯一 Worker Snowflake 节点号}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9091/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  edge:
  backend:
    internal: true

secrets:
  mysql-ca.pem:
    file: ${RYFRAME_MYSQL_CA_FILE:?必须设置 MySQL CA 证书文件}
  mysql-client-cert.pem:
    file: ${RYFRAME_MYSQL_CLIENT_CERT_FILE:?必须设置 MySQL 客户端证书文件}
  mysql-client-key.pem:
    file: ${RYFRAME_MYSQL_CLIENT_KEY_FILE:?必须设置 MySQL 客户端私钥文件}
  redis-ca.pem:
    file: ${RYFRAME_REDIS_CA_FILE:?必须设置 Redis CA 证书文件}
  redis-client-cert.pem:
    file: ${RYFRAME_REDIS_CLIENT_CERT_FILE:?必须设置 Redis 客户端证书文件}
  redis-client-key.pem:
    file: ${RYFRAME_REDIS_CLIENT_KEY_FILE:?必须设置 Redis 客户端私钥文件}
  redis-password:
    file: ${RYFRAME_REDIS_PASSWORD_FILE:?必须设置 Redis 密码 secret 文件}
  database-password:
    file: ${RYFRAME_DATABASE_PASSWORD_FILE:?必须设置数据库密码 secret 文件}
  database-replicas:
    file: ${RYFRAME_DATABASE_REPLICAS_FILE:?必须设置数据库副本 JSON 文件}
  database-sources:
    file: ${RYFRAME_DATABASE_SOURCES_FILE:?必须设置业务数据源 JSON 文件}
  object-storage-access-key:
    file: ${RYFRAME_OBJECT_STORAGE_ACCESS_KEY_FILE:?必须设置对象存储访问密钥文件}
  object-storage-secret-key:
    file: ${RYFRAME_OBJECT_STORAGE_SECRET_KEY_FILE:?必须设置对象存储私密密钥文件}
  auth-jwt-secret:
    file: ${RYFRAME_AUTH_JWT_SECRET_FILE:?必须设置 JWT secret 文件}
  metrics-bearer-token:
    file: ${RYFRAME_METRICS_BEARER_TOKEN_FILE:?必须设置指标 Bearer Token 文件}
