# RyFrame v0.5 生产环境模板。
# 此文件应由 nginx 的 `http` 块引入。
# 启用前，请替换 example.com 和证书路径。

limit_req_zone $binary_remote_addr zone=ryframe_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ryframe_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=ryframe_connections:10m;

upstream ryframe_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    # 仅在切换发布版本时添加蓝绿发布的对端。
    # 备用实例配置示例：server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# 管理后台单页应用（SPA）。此主机特意不代理 API，以确保刷新 Cookie 仅归属
# api.example.com 主机。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RYFRAME_SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ryframe/frontend;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; font-src 'self' data:; connect-src 'self' https://api.example.com wss://api.example.com; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location ~* ^/assets/.+\.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; font-src 'self' data:; connect-src 'self' https://api.example.com wss://api.example.com; upgrade-insecure-requests" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; font-src 'self' data:; connect-src 'self' https://api.example.com wss://api.example.com; upgrade-insecure-requests" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; font-src 'self' data:; connect-src 'self' https://api.example.com; upgrade-insecure-requests" always;
    }

    location ~ /\. {
        deny all;
    }
}

# API 主机。Nginx 终止 TLS 并覆写所有转发头。切勿在此使用
# $proxy_add_x_forwarded_for：不可信客户端提供的 XFF 不得追加到受信任链中。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RYFRAME_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req_status 429;
    error_page 429 = @nginx_rate_limited;

    location @nginx_rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 429 '{"code":429,"msg":"too many requests"}';
    }

    # 为 multipart 封装预留 64 KiB；业务校验仍将上传文件本体严格限制为 10 MiB
    # （头像为 5 MiB）。
    client_max_body_size 10304k;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;

    # 探针绕过应用和 Nginx 的业务限流。
    location = /livez {
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # 纵深防御：生产环境通过 APP_API_DOCS_ENABLED=false 在应用中禁用两个路由。
    # 即使应用配置回归导致它们被启用，也要在公网边缘保持阻断。
    location ^~ /api/v1/swagger-ui {
        return 404;
    }

    location = /api/v1/api-docs/openapi.json {
        return 404;
    }

    # 指标并非公开业务 API。只有来自明确受信任网络的监控代理可以访问此位置。
    # 应用还要求 `Authorization: Bearer <APP_MONITOR_METRICS_BEARER_TOKEN>`，
    # 并以恒定时间比较令牌。请将这些示例 CIDR 替换为部署实际使用的最小
    # Prometheus/VPN 网段。
    location = /api/v1/monitor/metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /api/v1/auth/login {
        limit_req zone=ryframe_login burst=3 nodelay;
        limit_conn ryframe_connections 5;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 已认证的文件上传和导入使用更长的上传超时。
    location ^~ /api/v1/common/upload {
        limit_req zone=ryframe_api burst=10 nodelay;
        limit_conn ryframe_connections 10;
        client_max_body_size 10304k;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/v1/auth/profile/avatar {
        limit_req zone=ryframe_api burst=5 nodelay;
        client_max_body_size 5184k;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/v1/common/upload/avatar {
        limit_req zone=ryframe_api burst=5 nodelay;
        client_max_body_size 5184k;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/v1/system/users/import {
        limit_req zone=ryframe_api burst=5 nodelay;
        client_max_body_size 10304k;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket 握手需要显式转发 Upgrade；票据位于查询参数中，因此不能写入访问日志。
    location = /api/v1/ws {
        limit_req zone=ryframe_api burst=10 nodelay;
        limit_conn ryframe_connections 20;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }

    location /api/ {
        limit_req zone=ryframe_api burst=20 nodelay;
        limit_conn ryframe_connections 20;
        proxy_pass http://ryframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
