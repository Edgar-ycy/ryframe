name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing coordinated stable tag to validate and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  FRONTEND_REPOSITORY: ${{ vars.RYFRAME_FRONTEND_REPOSITORY || format('{0}/ryframe-vue3', github.repository_owner) }}

permissions:
  actions: read
  contents: read

jobs:
  validate-release:
    name: Validate coordinated source release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      backend_tag_oid: ${{ steps.release.outputs.backend_tag_oid }}
      backend_commit: ${{ steps.release.outputs.backend_commit }}
      frontend_tag_oid: ${{ steps.release.outputs.frontend_tag_oid }}
      frontend_commit: ${{ steps.release.outputs.frontend_commit }}
      frontend_repository: ${{ steps.release.outputs.frontend_repository }}
    steps:
      - name: Check out backend tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify backend tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a backend commit contained in main."
            exit 1
          }
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]

      - name: Check out matching frontend tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: frontend

      - name: Verify frontend tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git -C frontend fetch --force --tags origin
          git -C frontend fetch --no-tags origin +main:refs/remotes/origin/main
          git -C frontend merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a frontend commit contained in main."
            exit 1
          }

      - name: 固定发布核验 Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: 安装固定并校验哈希的发布核验 Python 依赖
        run: >-
          python -m pip install
          --disable-pip-version-check
          --force-reinstall
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement scripts/requirements-ci.txt

      - name: 安装发布核验 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Validate release inputs
        shell: bash
        env:
          BACKEND_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          backend_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          frontend_commit="$(git -C frontend rev-parse "${RELEASE_TAG}^{commit}")"
          cargo xtask check release source \
            --tag "$RELEASE_TAG" \
            --frontend-dir "$GITHUB_WORKSPACE/frontend" \
            --backend-repository "$BACKEND_REPOSITORY" \
            --backend-commit "$backend_commit" \
            --frontend-repository "$FRONTEND_REPOSITORY" \
            --frontend-commit "$frontend_commit" \
            --manifest-path "$RUNNER_TEMP/release-validation.json"

      - name: Export immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tag=$RELEASE_TAG"
            echo "backend_tag_oid=$(git rev-parse "refs/tags/$RELEASE_TAG")"
            echo "backend_commit=$(git rev-parse "$RELEASE_TAG^{commit}")"
            echo "frontend_tag_oid=$(git -C frontend rev-parse "refs/tags/$RELEASE_TAG")"
            echo "frontend_commit=$(git -C frontend rev-parse "$RELEASE_TAG^{commit}")"
            echo "frontend_repository=$FRONTEND_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: 验证精确源码的日常与扩展 CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_SHA: ${{ steps.release.outputs.backend_commit }}
          FRONTEND_SHA: ${{ steps.release.outputs.frontend_commit }}
        run: >-
          cargo xtask check release ci
          --backend-repository "$GITHUB_REPOSITORY"
          --frontend-repository "$FRONTEND_REPOSITORY"
          --backend-sha "$BACKEND_SHA"
          --frontend-sha "$FRONTEND_SHA"
          --tag "$RELEASE_TAG"
          --timeout 5400
          --output "$RUNNER_TEMP/release-ci-evidence.json"

      - name: 保存发布校验记录
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation.json
            ${{ runner.temp }}/release-ci-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish source-only GitHub release
    needs: validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out fixed backend source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.backend_commit }}

      - name: Check out fixed frontend source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ needs.validate-release.outputs.frontend_repository }}
          ref: ${{ needs.validate-release.outputs.frontend_commit }}
          fetch-depth: 0
          path: frontend

      - name: 固定最终发布核验 Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: 安装固定并校验哈希的最终发布核验 Python 依赖
        run: >-
          python -m pip install
          --disable-pip-version-check
          --force-reinstall
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement scripts/requirements-ci.txt

      - name: 安装最终发布核验 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Revalidate tag objects
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          BACKEND_TAG_OID: ${{ needs.validate-release.outputs.backend_tag_oid }}
          BACKEND_COMMIT: ${{ needs.validate-release.outputs.backend_commit }}
          FRONTEND_TAG_OID: ${{ needs.validate-release.outputs.frontend_tag_oid }}
          FRONTEND_COMMIT: ${{ needs.validate-release.outputs.frontend_commit }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git -C frontend fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == tag ]]
          [[ "$(git -C frontend cat-file -t "refs/tags/${RELEASE_TAG}")" == tag ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}")" == "$BACKEND_TAG_OID" ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$BACKEND_COMMIT" ]]
          [[ "$(git rev-parse HEAD)" == "$BACKEND_COMMIT" ]]
          [[ "$(git -C frontend rev-parse "refs/tags/${RELEASE_TAG}")" == "$FRONTEND_TAG_OID" ]]
          [[ "$(git -C frontend rev-parse "${RELEASE_TAG}^{commit}")" == "$FRONTEND_COMMIT" ]]
          [[ "$(git -C frontend rev-parse HEAD)" == "$FRONTEND_COMMIT" ]]

      - name: Build release notes from immutable tag annotations
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          backend_notes="$RUNNER_TEMP/backend-release-notes.md"
          frontend_notes="$RUNNER_TEMP/frontend-release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$backend_notes"
          git -C frontend for-each-ref --format='%(contents)' \
            "refs/tags/$RELEASE_TAG" > "$frontend_notes"
          test -s "$backend_notes"
          test -s "$frontend_notes"

          {
            printf '# RyFrame %s\n\n' "$RELEASE_TAG"
            printf '# 后端更新\n\n'
            cat "$backend_notes"
            printf '\n\n# 前端更新\n\n'
            cat "$frontend_notes"
            printf '\n'
          } > release_body.md
          test -s release_body.md

      - name: 发布前复核最新 CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_SHA: ${{ needs.validate-release.outputs.backend_commit }}
          FRONTEND_SHA: ${{ needs.validate-release.outputs.frontend_commit }}
          BACKEND_TAG_OID: ${{ needs.validate-release.outputs.backend_tag_oid }}
          FRONTEND_TAG_OID: ${{ needs.validate-release.outputs.frontend_tag_oid }}
        run: >-
          cargo xtask check release ci
          --backend-repository "$GITHUB_REPOSITORY"
          --frontend-repository "$FRONTEND_REPOSITORY"
          --backend-sha "$BACKEND_SHA"
          --frontend-sha "$FRONTEND_SHA"
          --backend-tag-oid "$BACKEND_TAG_OID"
          --frontend-tag-oid "$FRONTEND_TAG_OID"
          --tag "$RELEASE_TAG"
          --timeout 5400
          --output "$RUNNER_TEMP/release-final-evidence.json"

      - name: Purge custom assets from target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          release_error="$RUNNER_TEMP/release-error.log"
          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_json" 2> "$release_error"; then
            release_id="$(jq -r '.id' "$release_json")"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[].id' > "$RUNNER_TEMP/release-asset-ids.txt"
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < "$RUNNER_TEMP/release-asset-ids.txt"
          elif grep --quiet 'HTTP 404' "$release_error"; then
            echo "No existing release assets to remove for $RELEASE_TAG."
          else
            cat "$release_error" >&2
            exit 1
          fi

      - name: Create source-only GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: RyFrame ${{ needs.validate-release.outputs.tag }}
          body_path: release_body.md
          prerelease: false
          make_latest: true

      - name: Verify published notes and zero custom assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          published_body="$RUNNER_TEMP/published-release-body.md"
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_json"
          jq --exit-status \
            --arg tag "$RELEASE_TAG" \
            '(.tag_name == $tag) and (.draft == false) and (.prerelease == false) and
             (.assets | length == 0) and
             ((.zipball_url // "") | length > 0) and
             ((.tarball_url // "") | length > 0)' \
            "$release_json" > /dev/null
          jq --join-output '.body // ""' "$release_json" > "$published_body"
          test -s "$published_body"
          diff --unified release_body.md "$published_body"

      - name: 保存最终发布证据
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-final-evidence.json
          if-no-files-found: error
          retention-days: 30
