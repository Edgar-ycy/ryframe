name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "5"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ============================================================
  # 代码质量门禁
  # ============================================================
  check:
    name: Check & Lint (Linux)
    # 周计划只刷新依赖安全结果，避免对未变化的源码重复执行编译与静态门禁。
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check source encoding and structure
        run: python scripts/check_source_hygiene.py

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Reject unreviewed prerelease dependencies
        run: python scripts/check_prerelease_dependencies.py

      - name: Check permission bindings
        run: python scripts/check_permission_routes.py

      - name: Check architecture boundaries
        run: python scripts/check_architecture.py

      # 每次源码变更只通过这一条生产目标 Clippy 命令编译工作区。
      - name: Clippy (production targets)
        run: cargo clippy --locked --workspace --lib --bins -- -D warnings

  # ============================================================
  # 安全检查
  # ============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-audit

      # rkyv 0.7.46 是 rust_decimal 未启用的可选依赖；若它进入实际构建图，则禁止继续忽略该漏洞。
      - name: Verify conditional rkyv audit exception
        run: |
          if cargo tree --locked --workspace --all-features --target all --invert rkyv@0.7.46 2>/dev/null | grep -Fxq 'rkyv v0.7.46'; then
            echo "::error::rkyv 0.7.46 已进入实际构建依赖图，必须先升级再通过安全审计"
            exit 1
          fi

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-deny

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources
