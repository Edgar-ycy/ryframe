name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "5"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  FRONTEND_REPOSITORY: ${{ vars.RYFRAME_FRONTEND_REPOSITORY || format('{0}/ryframe-vue3', github.repository_owner) }}

jobs:
  # ============================================================
  # 变更计划与快速预检：复用同一 checkout、Rust 工具链和 xtask 编译结果
  # ============================================================
  plan:
    name: Plan & Preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      preflight: ${{ steps.plan.outputs.preflight }}
      rust_gate: ${{ steps.plan.outputs.rust_gate }}
      resource_gate: ${{ steps.plan.outputs.resource_gate }}
      integration: ${{ steps.plan.outputs.integration }}
      consumer_contract: ${{ steps.plan.outputs.consumer_contract }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: backend

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: 计算动态门禁计划
        id: plan
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          RYFRAME_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RYFRAME_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo xtask check ci plan

      - name: 固定 CI Python 3.12
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: 选择快速预检匹配的前端提交
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        id: preflight-frontend-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/select_frontend_commit.py
          --event-name "$EVENT_NAME"
          --event "$GITHUB_EVENT_PATH"
          --backend-worktree .
          --base-sha "$BASE_SHA"
          --prefer-marker
          --release-ref "$GITHUB_REF"

      - name: 检出快速预检使用的前端源码
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ steps.preflight-frontend-ref.outputs.ref }}
          path: frontend

      - name: 安装固定并校验哈希的 CI Python 依赖
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        run: >-
          python -m pip install
          --disable-pip-version-check
          --force-reinstall
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement scripts/requirements-ci.txt

      - name: 安装 Rust 格式化工具链
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: 校验 GitHub Actions 工作流
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: backend/.github/workflows/ci.yml backend/.github/workflows/extended-ci.yml backend/.github/workflows/release.yml

      - name: 执行仓库快速预检
        if: ${{ steps.plan.outputs.preflight == 'true' }}
        env:
          RYFRAME_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask check ci preflight --frontend-dir ../frontend

  # ============================================================
  # Rust 单一编译门禁
  # ============================================================
  rust-gate:
    name: Rust Gate
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.rust_gate == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache/rust-gate
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: 检出后端源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: backend
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 选择匹配的前端提交
        id: frontend-ref
        working-directory: backend
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/select_frontend_commit.py
          --event-name "$EVENT_NAME"
          --event "$GITHUB_EVENT_PATH"
          --backend-worktree .
          --base-sha "$BASE_SHA"
          --prefer-marker
          --release-ref "$GITHUB_REF"

      - name: 检出前端资源 Workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ steps.frontend-ref.outputs.ref }}
          path: frontend

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy

      - name: 安装固定版本 sccache
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: sccache@0.17.0
          fallback: none

      - name: 缓存 sccache 编译产物
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cache/sccache/rust-gate
          key: v1-sccache-${{ runner.os }}-${{ runner.arch }}-rust-gate-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}

      - name: 缓存 Cargo 依赖
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-rust-gate-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-rust-gate-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: 安装 pnpm
        uses: ./frontend/.github/actions/setup-pnpm
        with:
          working-directory: frontend

      - name: 安装前端生成校验依赖
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: 执行 Clippy、feature、Workspace 测试与快照门禁
        working-directory: backend
        run: cargo xtask check ci rust-gate --frontend-dir ../frontend

      - name: 输出 sccache 命中统计
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          stats_file="$RUNNER_TEMP/sccache-rust-gate.json"
          sccache --show-stats --stats-format=json > "$stats_file"
          python backend/scripts/summarize_sccache_stats.py \
            --stats "$stats_file" \
            --label "Rust Gate" \
            --summary "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          sccache --stop-server

      - name: 保存 sccache JSON 统计
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sccache-rust-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sccache-rust-gate.json
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # 标准资源与前端消费者契约：复用前端 checkout、pnpm 和 Rust 缓存
  # ============================================================
  resource-gate:
    name: Resource & Contract Gate
    needs: plan
    if: >-
      ${{ needs.plan.result == 'success' &&
          (needs.plan.outputs.resource_gate == 'true' ||
           needs.plan.outputs.consumer_contract == 'true') }}
    runs-on: ubuntu-latest
    env:
      RYFRAME_INTEGRATION_RUN_ID: resource-${{ github.run_id }}-${{ github.run_attempt }}
      RYFRAME_MYSQL_INTEGRATION: "1"
      RYFRAME_MYSQL_TLS_INTEGRATION: "1"
      RYFRAME_MYSQL_HOST: 127.0.0.1
      RYFRAME_MYSQL_PORT: "3306"
      RYFRAME_MYSQL_USERNAME: root
      RYFRAME_MYSQL_PASSWORD: ryframe-ci-password
      RYFRAME_REDIS_INTEGRATION: "1"
      RYFRAME_REDIS_HOST: 127.0.0.1
      RYFRAME_REDIS_PORT: "6379"
      RYFRAME_REDIS_DATABASE: "15"
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: ryframe-ci-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ryframe-ci-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: 检出后端源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: backend
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-resource-gate-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-resource-gate-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: 选择匹配的前端提交
        id: resource-frontend-ref
        if: ${{ needs.plan.outputs.consumer_contract != 'true' }}
        working-directory: backend
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/select_frontend_commit.py
          --event-name "$EVENT_NAME"
          --event "$GITHUB_EVENT_PATH"
          --backend-worktree .
          --base-sha "$BASE_SHA"
          --prefer-marker
          --fallback-main-on-invalid-base
          --release-ref "$GITHUB_REF"

      - name: 生成候选契约并选择精确前端提交
        id: contract-frontend-ref
        if: ${{ needs.plan.outputs.consumer_contract == 'true' }}
        working-directory: backend
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/select_frontend_commit.py
          --event-name pull_request
          --event "$GITHUB_EVENT_PATH"
          --backend-worktree .
          --base-sha "$BASE_SHA"
          --candidate-openapi "$RUNNER_TEMP/candidate-openapi.json"

      - name: 检出前端资源 Workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ steps.contract-frontend-ref.outputs.ref || steps.resource-frontend-ref.outputs.ref }}
          path: frontend

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: 安装 pnpm
        uses: ./frontend/.github/actions/setup-pnpm
        with:
          working-directory: frontend

      - name: 安装前端资源校验依赖
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: 执行资源影响闭包与消费者门禁
        if: ${{ needs.plan.outputs.resource_gate == 'true' }}
        working-directory: backend
        env:
          RYFRAME_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RYFRAME_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RYFRAME_CI_FRONTEND_REF: ${{ steps.contract-frontend-ref.outputs.ref || steps.resource-frontend-ref.outputs.ref }}
          RYFRAME_RESOURCE_GATE_TARGETED: replay-verified-v1
        run: cargo xtask check ci resource-gate --frontend-dir ../frontend

      - name: 校验正式前端消费契约
        if: ${{ needs.plan.outputs.consumer_contract == 'true' }}
        working-directory: backend
        env:
          RYFRAME_CI_BACKEND_HEAD: ${{ github.event.pull_request.head.sha }}
          RYFRAME_CI_BACKEND_REPOSITORY: ${{ github.repository }}
          RYFRAME_CI_CANDIDATE_OPENAPI: ${{ runner.temp }}/candidate-openapi.json
          RYFRAME_CI_FRONTEND_REF: ${{ steps.contract-frontend-ref.outputs.ref }}
        run: cargo xtask check ci consumer-contract --frontend-dir ../frontend

  # ============================================================
  # MySQL、Redis 与 AWS-LC TLS 真实出站协议
  # ============================================================
  integration:
    name: MySQL 8.4, Redis 7.4 & AWS-LC TLS Integration
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    env:
      RYFRAME_INTEGRATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RYFRAME_MYSQL_INTEGRATION: "1"
      RYFRAME_MYSQL_TLS_INTEGRATION: "1"
      RYFRAME_MYSQL_HOST: 127.0.0.1
      RYFRAME_MYSQL_PORT: "3306"
      RYFRAME_MYSQL_USERNAME: root
      RYFRAME_MYSQL_PASSWORD: ryframe-ci-password
      RYFRAME_REDIS_INTEGRATION: "1"
      RYFRAME_REDIS_HOST: 127.0.0.1
      RYFRAME_REDIS_PORT: "6379"
      RYFRAME_REDIS_DATABASE: "15"
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: ryframe-ci-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ryframe-ci-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: 检出后端源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: backend
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: 安装固定 Python 版本
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: 缓存 Cargo 依赖
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-integration-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-integration-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: 验证 MySQL、Redis 与 AWS-LC TLS 真实出站协议
        working-directory: backend
        env:
          RYFRAME_TLS_ARTIFACT_DIR: ${{ runner.temp }}/ryframe-tls-integration
        run: cargo xtask check ci integration

      - name: 保存 AWS-LC TLS fixture 与测试日志
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tls-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ryframe-tls-integration
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # Windows 静态冒烟
  # ============================================================
  windows-smoke:
    name: Windows Smoke
    needs: plan
    if: >-
      ${{ needs.plan.result == 'success' &&
          github.event.action != 'edited' }}
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache/windows-smoke
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: 检出后端源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: ryframe
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: 安装固定版本 sccache
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: sccache@0.17.0
          fallback: none

      - name: 缓存 sccache 编译产物
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cache/sccache/windows-smoke
          key: v1-sccache-${{ runner.os }}-${{ runner.arch }}-windows-smoke-${{ hashFiles('ryframe/Cargo.lock', 'ryframe/rust-toolchain.toml') }}

      - name: 校验候选契约并选择配套前端提交
        id: windows-frontend-ref
        working-directory: ryframe
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/select_frontend_commit.py
          --event-name "$EVENT_NAME"
          --event "$GITHUB_EVENT_PATH"
          --backend-worktree .
          --base-sha "$BASE_SHA"
          --prefer-marker
          --candidate-openapi "$RUNNER_TEMP/windows-candidate-openapi.json"
          --release-ref "$GITHUB_REF"

      - name: 检出前端真实 Workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ steps.windows-frontend-ref.outputs.ref }}
          path: ryframe-vue3

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: ryframe-vue3/.node-version
          package-manager-cache: false

      - name: 安装 pnpm
        uses: ./ryframe-vue3/.github/actions/setup-pnpm
        with:
          working-directory: ryframe-vue3

      - name: 安装前端依赖
        working-directory: ryframe-vue3
        run: corepack pnpm install --frozen-lockfile

      - name: 执行 Windows 产品、工具、进程与资源 Workspace 门禁
        working-directory: ryframe
        env:
          RYFRAME_CI_FRONTEND_REF: ${{ steps.windows-frontend-ref.outputs.ref }}
          RYFRAME_CI_RUST_GATE_PROFILE: windows-smoke
          RYFRAME_CI_TEST_JOBS: "4"
        run: cargo xtask check ci rust-gate --frontend-dir ../ryframe-vue3

      - name: 输出 sccache 统计
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $statsFile = Join-Path $env:RUNNER_TEMP "sccache-windows-smoke.json"
          sccache --show-stats --stats-format=json | Set-Content -LiteralPath $statsFile -Encoding utf8
          python ryframe/scripts/summarize_sccache_stats.py `
            --stats $statsFile `
            --label "Windows Smoke" `
            --summary $env:GITHUB_STEP_SUMMARY
          sccache --show-stats
          sccache --stop-server

      - name: 保存 sccache JSON 统计
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sccache-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sccache-windows-smoke.json
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # 安全、许可证与部署资产：复用同一 checkout 和 Python 环境
  # ============================================================
  security-audit:
    name: Security, Supply Chain & Deployment
    needs: plan
    if: ${{ needs.plan.result == 'success' && github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: backend

      - name: 固定 CI Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: 安装固定并校验哈希的 CI Python 依赖
        run: >-
          python -m pip install
          --disable-pip-version-check
          --force-reinstall
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement scripts/requirements-ci.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install cargo-audit
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: 校验供应链策略和条件依赖例外
        run: python scripts/check_supply_chain.py --verify-cargo-graph

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

      - name: 判断是否需要校验部署资产
        id: deployment-changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          required=false
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            required=true
          else
            set +e
            git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml \
              .cargo \
              .dockerignore \
              Cargo.lock \
              Cargo.toml \
              build.rs \
              rust-toolchain.toml \
              architecture \
              catalog \
              config \
              crates \
              deploy \
              locales \
              scripts/check_deployment_assets.py \
              scripts/fixtures/deploy.env \
              vendor \
              xtask
            diff_status=$?
            set -e
            case "$diff_status" in
              0) required=false ;;
              1) required=true ;;
              *) echo "部署资产变更检测失败" >&2; exit "$diff_status" ;;
            esac
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: 校验部署资产静态边界
        if: steps.deployment-changes.outputs.required == 'true'
        run: python scripts/check_deployment_assets.py

      - name: 校验供应链固定版本与例外策略
        if: steps.deployment-changes.outputs.required == 'true'
        run: python scripts/check_supply_chain.py

      - name: 校验 Compose 展开结果
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker compose
          --project-directory "$GITHUB_WORKSPACE/backend"
          --env-file scripts/fixtures/deploy.env
          --file deploy/compose.prod.yml
          config --quiet

      - name: 校验 Nginx 配置
        if: steps.deployment-changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_dir="$RUNNER_TEMP/nginx-cert"
          mkdir --parents "$certificate_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=example.com" \
            -keyout "$certificate_dir/privkey.pem" \
            -out "$certificate_dir/fullchain.pem" >/dev/null 2>&1
          docker run --rm --entrypoint nginx \
            --volume "$GITHUB_WORKSPACE/backend/deploy/nginx/ryframe.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$certificate_dir:/etc/letsencrypt/live/example.com:ro" \
            nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            -t

      - name: 校验 Prometheus 告警规则与触发边界
        if: steps.deployment-changes.outputs.required == 'true'
        run: |
          promtool() {
            docker run --rm --entrypoint /bin/promtool \
              --volume "$GITHUB_WORKSPACE/backend/deploy/prometheus:/rules:ro" \
              --workdir /rules \
              prom/prometheus@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24 \
              "$@"
          }
          promtool check rules /rules/ryframe-alerts.yml
          promtool test rules /rules/ryframe-alerts.test.yml

      - name: 构建生产镜像
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker build
          --file deploy/Dockerfile
          --build-arg "RYFRAME_BUILD_COMMIT=$GITHUB_SHA"
          --tag "ryframe-ci:$GITHUB_SHA"
          .

      - name: 校验生产镜像内容
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          python scripts/check_deployment_assets.py
          --image "ryframe-ci:$GITHUB_SHA"
          --expected-commit "$GITHUB_SHA"



  # 分支保护只绑定这个稳定名称；事件不适用的 job 可以 skipped，失败和取消均拒绝。
  required:
    name: Required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - plan
      - rust-gate
      - resource-gate
      - integration
      - windows-smoke
      - security-audit
    steps:
      - name: 检出汇总规则
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: 汇总必须门禁
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/check_required_jobs.py
          --event "$EVENT_NAME"
          --action "$EVENT_ACTION"
          --needs-json "$NEEDS_JSON"
