name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "5"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ============================================================
  # 代码质量门禁
  # ============================================================
  check:
    name: Check & Lint (Linux)
    # 周计划只刷新依赖安全结果，避免对未变化的源码重复执行编译与静态门禁。
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Reject unreviewed prerelease dependencies
        run: python scripts/check_prerelease_dependencies.py

      - name: Test repository policy scripts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: 校验供应链固定版本与例外策略
        run: python scripts/check_supply_chain.py

      - name: Check workspace architecture and production source size
        run: python scripts/check_architecture.py

      - name: Check permission bindings
        run: python scripts/check_permission_routes.py

      - name: 校验部署资产静态边界
        run: python scripts/check_deployment_assets.py

      # 全目标静态检查覆盖正式测试，并显式阻止无意义克隆重新进入代码库。
      - name: Clippy (all targets, redundant clones denied)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::redundant_clone

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Verify generated OpenAPI and MySQL snapshots
        shell: bash
        run: |
          set -euo pipefail
          generated_openapi="$RUNNER_TEMP/openapi.json"
          generated_mysql="$RUNNER_TEMP/ryframe_config.sql"
          cargo run --locked -p ryframe-api --bin export_openapi -- "$generated_openapi"
          cargo run --locked -p ryframe-db --bin export_mysql_snapshot -- "$generated_mysql"
          diff --unified openapi/openapi.json "$generated_openapi"
          diff --unified sql/ryframe_config.sql "$generated_mysql"

  # ============================================================
  # 同步前端消费契约
  # ============================================================
  consumer-contract:
    name: Frontend Consumer Contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端 PR 提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: backend
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: 生成并分类候选契约
        id: contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate-openapi.json"
          baseline="$RUNNER_TEMP/baseline-openapi.json"
          cargo run --locked --manifest-path backend/Cargo.toml \
            -p ryframe-api --bin export_openapi -- "$candidate"
          cmp --silent backend/openapi/openapi.json "$candidate" || {
            echo "::error::后端 PR 未提交最新 OpenAPI 快照"
            exit 1
          }
          git -C backend show "$BASE_SHA:openapi/openapi.json" > "$baseline"
          if cmp --silent "$baseline" "$candidate"; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: 选择精确前端提交
        id: frontend-ref
        shell: bash
        env:
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed }}
        run: |
          set -euo pipefail
          frontend_ref="$(python backend/scripts/select_frontend_commit.py \
            --event "$GITHUB_EVENT_PATH" \
            --contract-changed "$CONTRACT_CHANGED")"
          echo "ref=$frontend_ref" >> "$GITHUB_OUTPUT"

      - name: 检出前端消费者
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Edgar-ycy/ryframe-vue3
          ref: ${{ steps.frontend-ref.outputs.ref }}
          path: frontend

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./frontend/.github/actions/setup-pnpm
        with:
          working-directory: frontend

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 校验前端消费契约
        working-directory: frontend
        env:
          BACKEND_COMMIT: ${{ github.event.pull_request.head.sha }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed }}
        run: >-
          pnpm consumer:check --
          --openapi "$RUNNER_TEMP/candidate-openapi.json"
          --backend-commit "$BACKEND_COMMIT"
          --backend-repository "Edgar-ycy/ryframe"
          --require-pin "$CONTRACT_CHANGED"

  # ============================================================
  # 安全检查
  # ============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: 校验供应链策略和条件依赖例外
        run: python scripts/check_supply_chain.py --verify-cargo-graph

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

  # ============================================================
  # 可复现软件物料清单
  # ============================================================
  supply-chain:
    name: 后端 CycloneDX 物料清单
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: 安装固定版本 CycloneDX 工具
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      - name: 生成并校验可复现 Cargo CycloneDX 清单
        shell: bash
        env:
          SBOM_PATH: ${{ runner.temp }}/supply-chain/ryframe-backend.cdx.json
        run: |
          set -euo pipefail
          mkdir --parents "$(dirname "$SBOM_PATH")"
          SOURCE_DATE_EPOCH="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx \
            --manifest-path crates/ryframe/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --target x86_64-unknown-linux-gnu \
            --all \
            --override-filename ryframe-backend.cdx.json
          mv crates/ryframe/ryframe-backend.cdx.json "$SBOM_PATH"
          python scripts/check_supply_chain.py \
            --cyclonedx "$SBOM_PATH" \
            --require-reproducible-cyclonedx

      - name: 保存 Cargo CycloneDX 清单
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ryframe-cargo-cyclonedx-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain/ryframe-backend.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 部署资产校验
  # ============================================================
  deployment-assets:
    name: Deployment Assets
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: 检出完整源码历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: 判断是否需要校验部署资产
        id: deployment-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$EVENT_NAME" == "schedule" ]] \
            || [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            required=true
          else
            set +e
            git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml \
              .cargo \
              .dockerignore \
              Cargo.lock \
              Cargo.toml \
              build.rs \
              rust-toolchain.toml \
              architecture \
              catalog \
              config \
              crates \
              deploy \
              locales \
              scripts/check_deployment_assets.py \
              scripts/fixtures/deploy.env \
              vendor \
              xtask
            diff_status=$?
            set -e
            case "$diff_status" in
              0) required=false ;;
              1) required=true ;;
              *) echo "部署资产变更检测失败" >&2; exit "$diff_status" ;;
            esac
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: 校验部署资产静态边界
        if: steps.deployment-changes.outputs.required == 'true'
        run: python scripts/check_deployment_assets.py

      - name: 校验供应链固定版本与例外策略
        if: steps.deployment-changes.outputs.required == 'true'
        run: python scripts/check_supply_chain.py

      - name: 校验 Compose 展开结果
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker compose
          --project-directory "$GITHUB_WORKSPACE"
          --env-file scripts/fixtures/deploy.env
          --file deploy/compose.prod.yml
          config --quiet

      - name: 校验 Nginx 配置
        if: steps.deployment-changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_dir="$RUNNER_TEMP/nginx-cert"
          mkdir --parents "$certificate_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=example.com" \
            -keyout "$certificate_dir/privkey.pem" \
            -out "$certificate_dir/fullchain.pem" >/dev/null 2>&1
          docker run --rm --entrypoint nginx \
            --volume "$GITHUB_WORKSPACE/deploy/nginx/ryframe.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$certificate_dir:/etc/letsencrypt/live/example.com:ro" \
            nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            -t

      - name: 校验 Prometheus 告警规则
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker run --rm --entrypoint /bin/promtool
          --volume "$GITHUB_WORKSPACE/deploy/prometheus:/rules:ro"
          prom/prometheus@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
          check rules /rules/ryframe-alerts.yml

      - name: 构建生产镜像
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker build
          --file deploy/Dockerfile
          --build-arg "RYFRAME_BUILD_COMMIT=$GITHUB_SHA"
          --tag "ryframe-ci:$GITHUB_SHA"
          .

      - name: 校验生产镜像内容
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          python scripts/check_deployment_assets.py
          --image "ryframe-ci:$GITHUB_SHA"
          --expected-commit "$GITHUB_SHA"

      - name: 安装固定版本镜像扫描器
        if: >-
          steps.deployment-changes.outputs.required == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: trivy@0.72.0
          fallback: none

      - name: 生成并校验生产镜像 CycloneDX 清单
        id: image-sbom
        if: >-
          steps.deployment-changes.outputs.required == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/supply-chain"
          mkdir --parents "$output_dir"
          trivy image \
            --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --timeout 30m \
            --format cyclonedx \
            --output "$output_dir/ryframe-image.cdx.json" \
            "ryframe-ci:$GITHUB_SHA"
          python scripts/check_supply_chain.py \
            --cyclonedx "$output_dir/ryframe-image.cdx.json"

      - name: 扫描生产镜像高危漏洞
        id: image-scan
        if: >-
          steps.deployment-changes.outputs.required == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --timeout 30m \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output "$RUNNER_TEMP/supply-chain/trivy-report.json" \
            "ryframe-ci:$GITHUB_SHA"

      - name: 应用有期限的漏洞例外策略
        if: >-
          steps.deployment-changes.outputs.required == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: >-
          python scripts/check_supply_chain.py
          --trivy-report "$RUNNER_TEMP/supply-chain/trivy-report.json"

      - name: 保存镜像清单与漏洞报告
        if: >-
          always() &&
          (steps.image-sbom.outcome == 'success' || steps.image-scan.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ryframe-image-security-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
          retention-days: 30
