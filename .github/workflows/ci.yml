name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "5"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ============================================================
  # 代码质量门禁
  # ============================================================
  check:
    name: Check & Lint (Linux)
    # 周计划只刷新依赖安全结果，避免对未变化的源码重复执行编译与静态门禁。
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            v3-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            v3-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Reject unreviewed prerelease dependencies
        run: python scripts/check_prerelease_dependencies.py

      - name: Check workspace architecture and production source size
        run: python scripts/check_architecture.py

      - name: Check permission bindings
        run: python scripts/check_permission_routes.py

      - name: 校验部署资产静态边界
        run: python scripts/check_deployment_assets.py

      # 全目标静态检查覆盖正式测试，并显式阻止无意义克隆重新进入代码库。
      - name: Clippy (all targets, redundant clones denied)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::redundant_clone

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Verify generated OpenAPI and MySQL snapshots
        shell: bash
        run: |
          set -euo pipefail
          generated_openapi="$RUNNER_TEMP/openapi.json"
          generated_mysql="$RUNNER_TEMP/ryframe_config.sql"
          cargo run --locked -p ryframe-api --bin export_openapi -- "$generated_openapi"
          cargo run --locked -p ryframe-db-migration --bin export_mysql_snapshot -- "$generated_mysql"
          diff --unified openapi/openapi.json "$generated_openapi"
          diff --unified sql/ryframe_config.sql "$generated_mysql"

  # ============================================================
  # 安全检查
  # ============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-audit

      # rkyv 0.7.46 是 rust_decimal 未启用的可选依赖；若它进入实际构建图，则禁止继续忽略该漏洞。
      - name: Verify conditional rkyv audit exception
        run: |
          if cargo tree --locked --workspace --all-features --target all --invert rkyv@0.7.46 2>/dev/null | grep -Fxq 'rkyv v0.7.46'; then
            echo "::error::rkyv 0.7.46 已进入实际构建依赖图，必须先升级再通过安全审计"
            exit 1
          fi

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-deny

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

  # ============================================================
  # 部署资产校验
  # ============================================================
  deployment-assets:
    name: Deployment Assets
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: 检出完整源码历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: 判断是否需要校验部署资产
        id: deployment-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$EVENT_NAME" == "schedule" ]] \
            || [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            required=true
          else
            set +e
            git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              .github/workflows/ci.yml \
              .cargo \
              .dockerignore \
              Cargo.lock \
              Cargo.toml \
              build.rs \
              rust-toolchain.toml \
              architecture \
              catalog \
              config \
              crates \
              deploy \
              locales \
              scripts/check_deployment_assets.py \
              scripts/fixtures/deploy.env \
              vendor \
              xtask
            diff_status=$?
            set -e
            case "$diff_status" in
              0) required=false ;;
              1) required=true ;;
              *) echo "部署资产变更检测失败" >&2; exit "$diff_status" ;;
            esac
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: 校验部署资产静态边界
        if: steps.deployment-changes.outputs.required == 'true'
        run: python scripts/check_deployment_assets.py

      - name: 校验 Compose 展开结果
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker compose
          --project-directory "$GITHUB_WORKSPACE"
          --env-file scripts/fixtures/deploy.env
          --file deploy/compose.prod.yml
          config --quiet

      - name: 校验 Nginx 配置
        if: steps.deployment-changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_dir="$RUNNER_TEMP/nginx-cert"
          mkdir --parents "$certificate_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=example.com" \
            -keyout "$certificate_dir/privkey.pem" \
            -out "$certificate_dir/fullchain.pem" >/dev/null 2>&1
          docker run --rm --entrypoint nginx \
            --volume "$GITHUB_WORKSPACE/deploy/nginx/ryframe.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$certificate_dir:/etc/letsencrypt/live/example.com:ro" \
            nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            -t

      - name: 校验 Prometheus 告警规则
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker run --rm --entrypoint /bin/promtool
          --volume "$GITHUB_WORKSPACE/deploy/prometheus:/rules:ro"
          prom/prometheus@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
          check rules /rules/ryframe-alerts.yml

      - name: 构建生产镜像
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          docker build
          --file deploy/Dockerfile
          --build-arg "RYFRAME_BUILD_COMMIT=$GITHUB_SHA"
          --tag "ryframe-ci:$GITHUB_SHA"
          .

      - name: 校验生产镜像内容
        if: steps.deployment-changes.outputs.required == 'true'
        run: >-
          python scripts/check_deployment_assets.py
          --image "ryframe-ci:$GITHUB_SHA"
          --expected-commit "$GITHUB_SHA"
