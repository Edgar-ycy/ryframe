[workspace]
default-members = ["crates/ryframe"]

members = [
    "crates/ryframe",
    "crates/ryframe-api", "crates/ryframe-auth", "crates/ryframe-config", "crates/ryframe-adapters", "crates/ryframe-db", "crates/ryframe-tenant-db", "crates/ryframe-kernel", "crates/ryframe-application",
    "crates/ryframe-generator", "crates/ryframe-macro",
    "crates/business/ryframe-business-application",
    "crates/business/ryframe-business-db",
    "crates/business/ryframe-business-api",
    "crates/business/ryframe-business-runtime",
    "xtask",
]
resolver = "3"
[workspace.package]
version = "0.12.1"
edition = "2024"
rust-version = "1.98"
authors = ["edgar_ye <edgar@example.com>"]
license = "MIT"
repository = "https://github.com/Edgar-ycy/ryframe"
homepage = "https://github.com/Edgar-ycy/ryframe"
description = "Production-oriented Rust 2024 admin backend with Vue 3, RBAC, observability, and multi-tenant support"

[workspace.lints.rust]
non_ascii_idents = "forbid"
unsafe_code = "forbid"


[workspace.dependencies]
axum = { version = "0.8", default-features = false }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
cookie = "0.18"
tokio = { version = "1", default-features = false }
async-trait = { version = "0.1" }
chrono = { version = "0.4" }
chrono-tz = "0.10"
cron = "0.17"
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "sqlx-mysql",
] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql"] }
rand = "0.10"
rand_core = { version = "0.10" }
serde = "1"
serde_json = "1"
jsonwebtoken = { version = "11.0", default-features = false }
#密码哈希
base64 = "0.23"
argon2 = "0.6.0"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-appender = "0.2"

log = "0.4"
validator = "0.21"
uuid = "1"

thiserror = "2"
http = "1"
http-body-util = "0.1"

sysinfo = { version = "0.39", default-features = false, features = ["system"] }

image = { version = "0.25", default-features = false }
calamine = { version = "0.36" }
rust_xlsxwriter = { version = "0.99.1" }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", default-features = false, features = ["vendored"] }
redis = { version = "1.4", default-features = false, features = ["tokio-rustls-comp", "connection-manager"] }

regex = "1"
tower-http = { version = "0.7" }
tower = { version = "0.5", default-features = false }
dashmap = "6"
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
prometheus = { version = "0.14", default-features = false }
lazy_static = "1"
futures-util = "0.3"
# OpenTelemetry 链路追踪
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "trace",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = { version = "0.33" }
tracing-opentelemetry = { version = "0.34", default-features = false }
# gRPC 传输支持
# 对象存储 (MinIO/S3)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
percent-encoding = "2"
# 消息队列 (Kafka, 可选 feature)
syn = { version = "3.0.6", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"

[patch.crates-io]
opentelemetry-otlp = { path = "vendor/opentelemetry-otlp" }
sea-orm = { path = "vendor/sea-orm" }
sea-orm-migration = { path = "vendor/sea-orm-migration" }
sqlx = { path = "vendor/sqlx-mysql-only" }

[profile.dev]
# 本地项目代码保留行级调试信息；依赖和构建脚本不生成调试信息，缩短冷构建与链接时间。
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.dev.build-override]
debug = 0

# Windows MSVC 的 adapters 测试需要轻微优化以降低 rustc 单态化栈压力；
# 产品开发构建保持 opt-level=0，避免把测试专属保护带入保存反馈路径。
[profile.test.package.ryframe-adapters]
opt-level = 1
