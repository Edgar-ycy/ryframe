[workspace]
default-members = ["crates/ryframe"]

members = [
    "crates/ryframe",
    "crates/ryframe-api", "crates/ryframe-auth", "crates/ryframe-config", "crates/ryframe-adapters", "crates/ryframe-db", "crates/ryframe-tenant-db", "crates/ryframe-http", "crates/ryframe-kernel", "crates/ryframe-application",
    "crates/ryframe-generator", "crates/ryframe-macro", "crates/ryframe-storage",
    "crates/ryframe-utils", "crates/ryframe-excel",
    "xtask",
]
resolver = "3"
[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
authors = ["edgar_ye <edgar@example.com>"]
license = "MIT"
repository = "https://github.com/Edgar-ycy/ryframe"
homepage = "https://github.com/Edgar-ycy/ryframe"
description = "Production-oriented Rust 2024 admin backend with Vue 3, RBAC, observability, and multi-tenant support"

[workspace.lints.rust]
non_ascii_idents = "forbid"


[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18"
tokio = { version = "1", default-features = false }
async-trait = { version = "0.1" }
chrono = { version = "0.4" }
chrono-tz = "0.10"
cron = "0.17"
sea-orm = { version = "=2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "sqlx-mysql",
] }
sea-orm-migration = { version = "=2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql"] }
rand = "0.10"
rand_core = { version = "0.10" }
serde = "1"
serde_json = "1"
jsonwebtoken = { version = "11.0", default-features = false }
#密码哈希
base64 = "0.23"
argon2 = "0.5"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-appender = "0.2"

log = "0.4"
validator = "0.21"
uuid = "1"

thiserror = "2"
http = "1"

sysinfo = "0.39"

image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
calamine = { version = "0.36" }
rust_xlsxwriter = { version = "0.97" }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["vendored"] }
redis = { version = "1.4", features = ["tokio-rustls-comp", "connection-manager"] }

regex = "1"
tower-http = { version = "0.7" }
dashmap = "6"
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
prometheus = "0.14"
lazy_static = "1"
futures-util = "0.3"
# OpenTelemetry 链路追踪
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto"] }
opentelemetry-semantic-conventions = { version = "0.32" }
tracing-opentelemetry = "0.33"
# gRPC 传输支持
# 对象存储 (MinIO/S3)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
percent-encoding = "2"
# 消息队列 (Kafka, 可选 feature)
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"

# 开发配置：轻微优化以降低 rustc 单态化栈压力，
# 解决 Windows MSVC 下 ryframe-adapters 测试编译时栈溢出问题
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
sqlx = { path = "vendor/sqlx-mysql-only" }

[profile.dev]
opt-level = 1
