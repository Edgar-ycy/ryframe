schema_version = 1

[resource]
name = "notice"
module = "system"
profile = "flat_crud"

[resource.labels]
zh_cn = "通知公告"
en = "Notice"

[storage]
kind = "control_row"
configuration_versioned = false

[database]
table = "sys_notice"
primary_key = ["id"]

[[database.indexes]]
name = "idx_tenant_id"
fields = ["tenant_id"]

[[database.indexes]]
name = "idx_created_by"
fields = ["created_by"]

[database.soft_delete]
field = "del_flag"
active = "0"
deleted = "2"

[database.audit]
created_at = "created_at"
updated_at = "updated_at"
created_by = "created_by"

[[fields]]
name = "id"
value_type = "i64"
wire_type = "string"
order = 10
widget = "hidden"

[fields.usage]
read = true
list = true

[fields.labels]
zh_cn = "公告编号"
en = "Notice ID"

[[fields]]
name = "tenant_id"
value_type = "string"
order = 20
widget = "hidden"

[fields.usage]

[fields.labels]
zh_cn = "租户"
en = "Tenant"

[[fields]]
name = "title"
value_type = "string"
order = 30
widget = "text"

[fields.usage]
create = true
update = true
read = true
list = true
filter = true

[fields.validation]
required = true
min_length = 1
max_length = 200

[fields.labels]
zh_cn = "公告标题"
en = "Notice title"

[[fields]]
name = "content_markdown"
column = "content"
value_type = "string"
order = 40
widget = "text"

[fields.usage]
create = true
update = true
read = true
list = true

[fields.validation]
required = true
min_utf8_bytes = 1
max_utf8_bytes = 60000

[fields.labels]
zh_cn = "公告内容"
en = "Notice content"

[[fields]]
name = "notice_type"
column = "type"
value_type = "string"
order = 50
nullable = true
widget = "text"

[fields.usage]
create = true
update = true
read = true
list = true
filter = true
filter_exact = true

[fields.labels]
zh_cn = "公告类型"
en = "Notice type"

[[fields]]
name = "status"
value_type = "string"
order = 60
default = "1"
widget = "text"

[fields.usage]
update = true
read = true
list = true
filter = true
filter_exact = true

[fields.validation]

[fields.labels]
zh_cn = "公告状态"
en = "Notice status"

[[fields]]
name = "created_by"
value_type = "i64"
wire_type = "string"
order = 70
nullable = true
widget = "hidden"

[fields.usage]
read = true
list = true

[fields.labels]
zh_cn = "创建人"
en = "Created by"

[[fields]]
name = "del_flag"
value_type = "string"
order = 80
default = "0"
widget = "hidden"

[fields.usage]

[fields.labels]
zh_cn = "删除标记"
en = "Deleted flag"

[[fields]]
name = "created_at"
value_type = "date_time"
order = 90
widget = "date_time"

[fields.usage]
read = true
list = true
sort = true
sort_desc = true

[fields.labels]
zh_cn = "创建时间"
en = "Created at"

[[fields]]
name = "updated_at"
value_type = "date_time"
order = 100
widget = "date_time"

[fields.usage]

[fields.labels]
zh_cn = "更新时间"
en = "Updated at"

[api]
path = "/api/v1/system/notices"

[api.operations]
create = "post_system_notices"
read = "get_system_notices_by_id"
list = "get_system_notices"
update = "put_system_notices_by_id"
delete = "delete_system_notices_by_id"

[access]
capability = "system.notice"
owner_field = "created_by"

[access.permissions]
create = "system:notice:add"
read = "system:notice:list"
list = "system:notice:list"
update = "system:notice:edit"
delete = "system:notice:remove"

[menu]
key = "system.notice"
parent = "system"
order = 15

[menu.labels]
zh_cn = "通知公告"
en = "Notices"

[route]
key = "system.notice"
path = "/system/notice"

[extensions.frontend]
page = "@/views/system/notice/index.vue"
