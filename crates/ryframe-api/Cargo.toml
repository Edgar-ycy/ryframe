[package]
name = "ryframe-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
ryframe-http = { path = "../ryframe-http", features = ["openapi"] }
ryframe-kernel = { path = "../ryframe-kernel" }
ryframe-utils = { path = "../ryframe-utils" }
ryframe-captcha = { path = "../ryframe-captcha" }
ryframe-excel = { path = "../ryframe-excel" }
ryframe-i18n = { path = "../ryframe-i18n" }
ryframe-auth = { path = "../ryframe-auth" }
ryframe-service = { path = "../ryframe-service" }
ryframe-config = { path = "../ryframe-config" }
ryframe-core = { path = "../ryframe-core" }
ryframe-monitor = { path = "../ryframe-monitor" }
ryframe-middleware = { path = "../ryframe-middleware" }
ryframe-macro = { path = "../ryframe-macro" }
axum = { workspace = true, features = ["multipart"] }
axum-extra = { workspace = true }
cookie = { workspace = true }
serde = { workspace = true, features = ["derive"] }
validator = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v7"] }
