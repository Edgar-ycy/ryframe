[package]
name = "ryframe-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
runtime-swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
ryframe-kernel = { path = "../ryframe-kernel" }
ryframe-auth = { path = "../ryframe-auth" }
ryframe-application = { path = "../ryframe-application" }
ryframe-macro = { path = "../ryframe-macro" }
axum = { workspace = true, features = ["multipart"] }
http = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "compression-gzip", "compression-br"] }
axum-extra = { workspace = true }
cookie = { workspace = true }
serde = { workspace = true, features = ["derive"] }
validator = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v7"] }
base64 = { workspace = true }
rand = { workspace = true }
image = { workspace = true }
regex = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
syn = { workspace = true }
toml.workspace = true

[lints]
workspace = true
