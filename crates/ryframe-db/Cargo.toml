[package]
name = "ryframe-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
default = []
connection = [
    "dep:ryframe-kernel",
    "dep:ryframe-config",
    "dep:sea-orm",
    "dep:log",
    "dep:serde",
    "dep:toml",
]
migration = ["connection", "dep:sea-orm-migration", "dep:async-trait"]
repositories = [
    "connection",
    "dep:ryframe-application",
    "dep:ryframe-macro",
    "dep:async-trait",
    "dep:futures-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:serde_json",
    "dep:chrono",
    "dep:tokio",
]
telemetry = [
    "repositories",
    "dep:opentelemetry",
    "dep:opentelemetry-semantic-conventions",
]

[dependencies]
ryframe-kernel = { path = "../ryframe-kernel", optional = true }
ryframe-application = { path = "../ryframe-application", default-features = false, optional = true }
ryframe-config = { path = "../ryframe-config", optional = true }
ryframe-macro = { path = "../ryframe-macro", optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["registry", "std", "fmt"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
chrono = { workspace = true, optional = true, features = ["serde"] }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "export_mysql_snapshot"
path = "src/bin/export_mysql_snapshot.rs"
required-features = ["migration"]
test = false

[[test]]
name = "mapping_contracts"
path = "tests/mapping_contracts.rs"
required-features = ["repositories", "migration"]

[[test]]
name = "mysql_real_protocol"
path = "tests/mysql_real_protocol.rs"
required-features = ["repositories"]

[lints]
workspace = true
