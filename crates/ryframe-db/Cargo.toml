[package]
name = "ryframe-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
ryframe-kernel = { path = "../ryframe-kernel" }
ryframe-utils = { path = "../ryframe-utils" }
ryframe-config = { path = "../ryframe-config" }
ryframe-core = { path = "../ryframe-core" }
ryframe-macro = { path = "../ryframe-macro" }
sea-orm = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "std", "fmt"] }
serde = { workspace = true ,features = ["derive"]}
serde_json = { workspace = true }
chrono = {workspace = true,features = ["serde"]}
rand = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
sea-orm = { workspace = true }

[[bench]]
name = "db_bench"
harness = false
