version = 1
description = "普通 CRUD 端口不得新增 PersistenceFuture；以下复杂流程需先拆清事务边界再迁移。"

[[exception]]
id = "audit-outbox"
paths = [
  "crates/ryframe-application/src/audit.rs",
  "crates/ryframe-db/src/application_ports/audit.rs",
]
reason = "失败审计与成功审计采用不同事务边界，成功事件还需与业务事务绑定后再标记提交。"

[[exception]]
id = "agent-authorization"
paths = [
  "crates/ryframe-application/src/agent/**",
  "crates/ryframe-application/src/ports/auth/**",
  "crates/ryframe-application/src/ports/authorization/**",
  "crates/ryframe-db/src/application_ports/agent/**",
  "crates/ryframe-db/src/application_ports/auth/**",
  "crates/ryframe-db/src/application_ports/authorization/**",
]
reason = "身份解析、委托授权和镜像写入包含失败审计及多步授权快照，必须保留显式补偿路径。"

[[exception]]
id = "asynchronous-workflows"
paths = [
  "crates/ryframe-application/src/ports/export/**",
  "crates/ryframe-application/src/ports/jobs/**",
  "crates/ryframe-application/src/ports/retention/**",
  "crates/ryframe-db/src/application_ports/export/**",
  "crates/ryframe-db/src/application_ports/jobs/**",
  "crates/ryframe-db/src/application_ports/retention/**",
]
reason = "导出、任务和保留策略使用租约、幂等状态机及失败恢复，不能套用单次 CRUD 事务完成函数。"

[[exception]]
id = "external-storage"
paths = [
  "crates/ryframe-application/src/ports/files/**",
  "crates/ryframe-db/src/application_ports/files/**",
]
reason = "文件元数据事务与对象存储补偿操作存在跨资源提交顺序。"

[[exception]]
id = "tenant-lifecycle"
paths = [
  "crates/ryframe-application/src/ports/product.rs",
  "crates/ryframe-application/src/ports/service_accounts/**",
  "crates/ryframe-application/src/ports/tenant_config/**",
  "crates/ryframe-application/src/ports/tenant_data/**",
  "crates/ryframe-application/src/ports/tenants/**",
  "crates/ryframe-application/src/ports/users/**",
  "crates/ryframe-db/src/application_ports/product.rs",
  "crates/ryframe-db/src/application_ports/service_accounts/**",
  "crates/ryframe-db/src/application_ports/tenant_config/**",
  "crates/ryframe-db/src/application_ports/tenants/**",
  "crates/ryframe-db/src/application_ports/users/**",
  "crates/ryframe-tenant-db/src/application_ports/**",
]
reason = "租户生命周期、配置迁移和用户导入包含跨库事务、授权缓存或可恢复批次，需逐用例确定审计模式。"

[[exception]]
id = "message-delivery"
paths = [
  "crates/ryframe-application/src/ports/system/message.rs",
  "crates/ryframe-db/src/application_ports/system/message.rs",
]
reason = "消息发布同时维护 inbox、outbox 与投递状态，提交和回滚由消息状态机决定。"
