[package]
name = "ryframe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
default-run = "ryframe"

[dependencies]
ryframe-kernel = { path = "../ryframe-kernel" }
ryframe-config = { path = "../ryframe-config" }
ryframe-db = { path = "../ryframe-db" }
ryframe-tenant-db = { path = "../ryframe-tenant-db" }
ryframe-adapters = { path = "../ryframe-adapters" }
ryframe-application = { path = "../ryframe-application" }
ryframe-api = { path = "../ryframe-api", default-features = false }
ryframe-auth = { path = "../ryframe-auth" }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"]}
tracing-appender = { workspace = true }
sea-orm = { workspace = true}
redis = { workspace = true }
futures-util = { workspace = true }
md5 = { version = "0.8", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
zip = { workspace = true }

[features]
default = ["runtime-swagger-ui"]
runtime-swagger-ui = ["ryframe-api/runtime-swagger-ui"]
# 一次性文件维护工具必须显式启用，常规 API、Worker 和迁移命令不会携带旧 MD5 实现。
file-maintenance = ["dep:md5", "dep:sha2", "dep:hex"]
# 破坏性环境重建能力不进入常规二进制和生产镜像。
destructive-reset = ["dep:sha2", "dep:hex", "dep:serde"]

[[bin]]
name = "ryframe"
path = "src/main.rs"

[[bin]]
name = "ryframe-reset"
path = "src/bin/ryframe_reset.rs"
required-features = ["destructive-reset"]

[[bin]]
name = "ryframe-migrate"
path = "src/bin/ryframe_migrate.rs"

[[bin]]
name = "ryframe-tenant-data"
path = "src/bin/ryframe_tenant_data.rs"

[[bin]]
name = "ryframe-worker"
path = "src/bin/ryframe_worker.rs"

[[bin]]
name = "ryframe-file-maintenance"
path = "src/bin/ryframe_file_maintenance.rs"
required-features = ["file-maintenance"]

[lints]
workspace = true
