[package]
name = "ryframe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
default-run = "ryframe"

[dependencies]
ryframe-kernel = { path = "../ryframe-kernel" }
ryframe-utils = { path = "../ryframe-utils" }
ryframe-i18n = { path = "../ryframe-i18n" }
ryframe-config = { path = "../ryframe-config" }
ryframe-db = { path = "../ryframe-db" }
ryframe-db-migration = { path = "../ryframe-db-migration" }
ryframe-core = { path = "../ryframe-core" }
ryframe-service = { path = "../ryframe-service" }
ryframe-api = { path = "../ryframe-api" }
ryframe-auth = { path = "../ryframe-auth" }
ryframe-middleware = { path = "../ryframe-middleware" }
ryframe-monitor = { path = "../ryframe-monitor" }
ryframe-storage = { path = "../ryframe-storage" }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"]}
tracing-appender = { workspace = true }
sea-orm = { workspace = true}
redis = { workspace = true }
md5 = { version = "0.8", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[features]
default = []
# 一次性文件维护工具必须显式启用，常规 API、Worker 和迁移命令不会携带旧 MD5 实现。
file-maintenance = ["dep:md5", "dep:sha2", "dep:hex", "dep:chrono"]

[[bin]]
name = "ryframe"
path = "src/main.rs"

[[bin]]
name = "ryframe-db-reset"
path = "src/bin/ryframe_db_reset.rs"

[[bin]]
name = "ryframe-migrate"
path = "src/bin/ryframe_migrate.rs"

[[bin]]
name = "ryframe-worker"
path = "src/bin/ryframe_worker.rs"

[[bin]]
name = "ryframe-file-maintenance"
path = "src/bin/ryframe_file_maintenance.rs"
required-features = ["file-maintenance"]

[lints]
workspace = true
