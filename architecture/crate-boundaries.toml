    "ryframe-adapters -> ryframe-application",
    "ryframe-api -> ryframe-application",
    "ryframe-api -> ryframe-auth",
    "ryframe-api -> ryframe-kernel",
    "ryframe-api -> ryframe-macro",
    "ryframe-application -> ryframe-auth",
    "ryframe-application -> ryframe-kernel",
    "ryframe-auth -> ryframe-kernel",
    "ryframe-config -> ryframe-kernel",
    "ryframe-db -> ryframe-application",
    "ryframe-db -> ryframe-config",
    "ryframe-db -> ryframe-kernel",
    "ryframe-db -> ryframe-macro",
    "ryframe-generator -> ryframe-kernel",
    "ryframe-generator -> ryframe-tenant-db",
    "ryframe-sdk -> ryframe-api",
    "ryframe-sdk -> ryframe-application",
    "ryframe-sdk -> ryframe-db",
    "ryframe-sdk -> ryframe-kernel",
    "ryframe-sdk -> ryframe-macro",
    "ryframe-sdk -> ryframe-tenant-db",
    "ryframe-tenant-db -> ryframe-application",
    "ryframe-tenant-db -> ryframe-config",
