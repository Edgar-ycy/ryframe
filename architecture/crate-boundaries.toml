run_tenant_data_legacy_checks = true
packages = [
    "ryframe",
    "ryframe-api",
    "ryframe-auth",
    "ryframe-config",
    "ryframe-adapters",
    "ryframe-db",
    "ryframe-generator",
    "ryframe-kernel",
    "ryframe-macro",
    "ryframe-application",
    "ryframe-tenant-db",
    "xtask",
]
