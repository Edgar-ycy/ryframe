schema_version = 1
active_profile = "transition"

# 源码规模检查从当前 profile 的 product_packages 自动发现所有生产 crate，
# 不再维护容易漏项的目录白名单。
[source_size]
max_lines = 1000

# 生成文件必须精确登记，并保留可验证的生成标记；禁止按目录名宽泛排除。
[[source_size.generated_exclusions]]
path = "crates/ryframe-tenant-db-migration/src/generated_catalog.rs"
required_marker = "此文件是 ryframe-generator 的编译输入"
reason = "由代码生成器维护的租户数据 catalog"

# 仅锁住已存在的超限文件，禁止继续增长；拆分到全局上限以内后必须删除对应豁免。
[[source_size.legacy_exceptions]]
path = "crates/ryframe-tenant-db/src/router.rs"
max_lines = 2472
reason = "租户数据路由待按目标注册、路由解析和迁移协调拆分"

[[source_size.legacy_exceptions]]
path = "crates/ryframe-tenant-db-migration/src/lib.rs"
max_lines = 1290
reason = "租户迁移实现将在并入 ryframe-tenant-db 时拆分"

[[source_size.legacy_exceptions]]
path = "crates/ryframe-api/src/openapi.rs"
max_lines = 1007
reason = "OpenAPI 注册表待按契约域拆分"

[[source_size.legacy_exceptions]]
path = "crates/ryframe-db-migration/src/schema.rs"
max_lines = 1188
reason = "控制库 schema 校验待随迁移能力并入 ryframe-db 后拆分"

