schema_version = 2
active_profile = "final"

# 源码规模检查从当前 profile 的 product_packages 自动发现所有生产 crate，
# 不再维护容易漏项的目录白名单。
[source_size]
max_lines = 600
generated_max_lines = 500
generated_markers = [
    "@generated by RyFrame",
    "此文件是 ryframe-generator 的编译输入",
]
frozen_migration_lock = "catalog/migrations.lock.toml"

[function_size]
# 全量检查所有 Rust 函数，禁止重新引入存量例外。
mode = "all"
public_max_lines = 150
private_max_lines = 100
orchestration_max_lines = 80
max_exception_days = 30
orchestrations = [
    { path = "xtask/src/ci/resource_gate.rs", symbol = "run" },
    { path = "xtask/src/ci/resource_gate.rs", symbol = "execute_plan" },
    { path = "xtask/src/ci/resource_gate/model.rs", symbol = "plan_steps" },
    { path = "xtask/src/ci/resource_gate/model.rs", symbol = "analyze" },
    { path = "xtask/src/ci/resource_gate/repository.rs", symbol = "load" },
    { path = "xtask/src/devex.rs", symbol = "run" },
    { path = "xtask/src/devex/run.rs", symbol = "execute" },
    { path = "xtask/src/devex/run.rs", symbol = "prepare_run" },
    { path = "xtask/src/devex/run.rs", symbol = "execute_warmup" },
    { path = "xtask/src/devex/run.rs", symbol = "execute_measurements" },
    { path = "xtask/src/devex/run.rs", symbol = "execute_sample" },
    { path = "xtask/src/devex/preflight.rs", symbol = "check" },
    { path = "xtask/src/devex/metadata.rs", symbol = "collect" },
    { path = "xtask/src/devex/report.rs", symbol = "summarize" },
    { path = "xtask/src/devex/report.rs", symbol = "compare" },
    { path = "xtask/src/dev/model.rs", symbol = "BuildPlan::from_changes" },
    { path = "xtask/src/dev/orchestrator.rs", symbol = "run" },
    { path = "xtask/src/dev/orchestrator.rs", symbol = "build_initial_candidate" },
    { path = "xtask/src/dev/orchestrator.rs", symbol = "supervise" },
    { path = "xtask/src/dev/orchestrator.rs", symbol = "process_change" },
    { path = "xtask/src/dev/orchestrator.rs", symbol = "handle_candidate_result" },
    { path = "xtask/src/dev/build.rs", symbol = "build_candidate" },
    { path = "xtask/src/dev/build.rs", symbol = "prepare_artifacts" },
    { path = "xtask/src/dev/build.rs", symbol = "validate_candidate_migration" },
    { path = "xtask/src/dev/build.rs", symbol = "run_resource_check" },
    { path = "xtask/src/dev/build/targets.rs", symbol = "build_targets" },
    { path = "xtask/src/dev/build/targets.rs", symbol = "build_target" },
    { path = "xtask/src/dev/build.rs", symbol = "run_migration_validation" },
    { path = "xtask/src/dev/build.rs", symbol = "stage_candidate" },
    { path = "xtask/src/dev/measure.rs", symbol = "run" },
    { path = "xtask/src/dev/services.rs", symbol = "probe_candidate" },
    { path = "xtask/src/dev/services.rs", symbol = "start_services" },
    { path = "xtask/src/dev/services.rs", symbol = "promote_services" },
    { path = "xtask/src/dev/services.rs", symbol = "switch_services_with_rollback" },
    { path = "xtask/src/dev/services.rs", symbol = "restore_last_known_good" },
]
exceptions = []

# 私有纯逻辑允许在生产模块中就地单测；公开契约与跨层场景仍放在所属 crate/tests。
[test_layout]
directory = "tests"
allow_colocated_unit_tests = true
forbid_source_test_files = true
max_integration_test_lines = 1000
disabled_bin_test_targets = [
    "ryframe:ryframe",
    "ryframe:export_openapi",
    "ryframe:ryframe-file-maintenance",
    "ryframe:ryframe-migrate",
    "ryframe:ryframe-reset",
    "ryframe:ryframe-tenant-data",
    "ryframe:ryframe-worker",
    "ryframe-db:export_mysql_snapshot",
    "xtask:xtask",
]

# 官方框架与工具 crate；使用者业务 crate 由 package metadata 单独识别。
[profiles.final]
expected_package_count = 13
packages = [
    "ryframe",
    "ryframe-adapters",
    "ryframe-api",
    "ryframe-application",
    "ryframe-auth",
    "ryframe-config",
    "ryframe-db",
    "ryframe-generator",
    "ryframe-kernel",
    "ryframe-macro",
    "ryframe-sdk",
    "ryframe-tenant-db",
    "xtask",
]
