schema_version = 1
active_profile = "final"

# 源码规模检查从当前 profile 的 product_packages 自动发现所有生产 crate，
# 不再维护容易漏项的目录白名单。
[source_size]
max_lines = 1000

# 生成文件必须精确登记，并保留可验证的生成标记；禁止按目录名宽泛排除。
[[source_size.generated_exclusions]]
path = "crates/ryframe-tenant-db/src/migration/generated_catalog.rs"
required_marker = "此文件是 ryframe-generator 的编译输入"
reason = "由代码生成器维护的租户数据 catalog"

# 当前 12 包过渡图。允许边是上限：删边无需修改本文件，新增边必须先通过架构评审。
[profiles.transition]
