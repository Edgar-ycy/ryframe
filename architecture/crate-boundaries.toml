# 私有纯逻辑允许在生产模块中就地单测；公开契约与跨层场景仍放在所属 crate/tests。
[test_layout]
directory = "tests"
allow_colocated_unit_tests = true
forbid_source_test_files = true
max_integration_test_lines = 1000
disabled_bin_test_targets = [
    "ryframe:ryframe",
    "ryframe:ryframe-file-maintenance",
    "ryframe:ryframe-migrate",
    "ryframe:ryframe-reset",
    "ryframe:ryframe-tenant-data",
    "ryframe:ryframe-worker",
    "ryframe-api:export_openapi",
    "ryframe-db:export_mysql_snapshot",
    "xtask:xtask",
]

