version = 2

[warning_budgets]
backend_handwritten_product = 7
frontend_handwritten_product = 6
combined_handwritten_product = 10

[soft_source_size]
warning_percent = 80
attention_percent = 90
backend_rust_hard_limit = 600
frontend_typescript_hard_limit = 300
frontend_composable_hard_limit = 300
frontend_sfc_hard_limit = 400
frontend_style_hard_limit = 300
frontend_script_hard_limit = 500

