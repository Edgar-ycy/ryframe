format_version = 1
id = "ryframe-language-bytes-v1"
measurement = "工作区普通文件的原始字节，包含注释、空白及模板标记，不计算代码行或 Git blob 大小"
inventory = "Git 已跟踪与未跟踪非 ignored 文件的并集；再次排除已跟踪但符合标准 ignore 规则的文件；已删除文件单列"
denominator = "所有自维护代码字节，包含手写、测试、受管生成代码及源代码模板；vendor/ 全部单列，不进入分子或分母"
embedded_lua_rule = "仅 xtask/src/recovery/clone/native/target_verify/fresh/initialize/marker.rs 的唯一顶层 SCRIPT 原始字符串内容按 Lua 计量，原始换行计入，Rust 定界符及其余宿主字节仍归 Rust；同一物理文件可出现在两种语言的文件计数中，物理文件和分母只统计一次"
unknown_text = "未匹配文档、配置或资源规则的 UTF-8 文本按 Other 代码计入分母；未知二进制按资源计量；已知代码含 NUL 或非 UTF-8 时失败"
case_rule = "扩展名与特殊文件名按 ASCII 小写匹配；路径目录标记大小写敏感"
legacy_reference = "54.4% 为不可复现的旧参考：未找到绑定源码、文件集合及分类规则的原始证据，不与本口径计算趋势"
template_suffixes = ["tpl", "tmpl", "hbs", "handlebars", "j2", "jinja", "jinja2", "tera", "ejs", "part"]
template_rule = "逐层剥离末尾模板后缀，按目标扩展名分类；无法识别目标的模板按 Template 代码计量；全部模板字节纳入其类别"
generated_components = ["generated"]
generated_name_fragments = [".generated."]
generated_name_prefixes = ["generated_"]
generated_paths = ["openapi/openapi.json", "sql/ryframe_config.sql"]
generated_line_prefixes = ["// @generated by RyFrame", "<!-- @generated by RyFrame", "# @generated by RyFrame"]
generated_rule = "目录、文件名或精确路径匹配，或前 2048 字节内有独立行以登记标记开头；仅用于分组，不排除字节"
test_components = ["tests", "test", "__tests__", "fixtures"]
test_name_prefixes = ["test_"]
test_name_fragments = [".test.", ".spec.", "_test."]
test_rule = "按文件路径识别测试；嵌入普通源文件的测试归入该文件，不分割或扣除；仅用于分组，不排除字节"
code_group_rule = "互斥汇总按测试、模板、生成、手写的优先级归组；逐文件保留全部独立标记，语言分母始终包含所有代码"
document_extensions = ["md", "markdown", "rst", "adoc", "txt"]
document_names = ["license", "license-mit", "license-apache", "copying", "notice", "authors", "changelog"]
config_extensions = ["toml", "json", "jsonc", "json5", "yaml", "yml", "xml", "ini", "cfg", "conf", "config", "lock", "csv", "tsv", "env", "properties"]
config_names = [".gitignore", ".gitattributes", ".gitmodules", ".editorconfig", ".dockerignore", ".npmrc", ".nvmrc", ".prettierignore", "codeowners"]
config_name_prefixes = [".env"]
resource_extensions = ["png", "jpg", "jpeg", "gif", "webp", "avif", "ico", "svg", "bmp", "tif", "tiff", "woff", "woff2", "ttf", "otf", "eot", "pdf", "xlsx", "xls", "docx", "pptx", "zip", "gz", "tar", "7z", "br", "zst", "mp3", "mp4", "wav", "ogg", "webm", "bin", "wasm", "exe", "dll", "pdb", "so", "dylib", "a", "lib", "pem", "crt", "key", "der"]

[source_extensions]
Rust = ["rs"]
Python = ["py", "pyi", "pyw"]
JavaScript = ["js", "cjs", "mjs", "jsx"]
TypeScript = ["ts", "cts", "mts", "tsx"]
Vue = ["vue"]
SQL = ["sql"]
Shell = ["sh", "bash", "zsh", "fish"]
PowerShell = ["ps1", "psm1", "psd1"]
Batch = ["bat", "cmd"]
CSS = ["css", "scss", "sass", "less"]
HTML = ["html", "htm"]
C = ["c", "h"]
Cpp = ["cpp", "cc", "cxx", "hpp", "hh", "hxx"]
Go = ["go"]
Java = ["java"]
Kotlin = ["kt", "kts"]
Ruby = ["rb"]
PHP = ["php"]
Lua = ["lua"]
Swift = ["swift"]
CSharp = ["cs"]
FSharp = ["fs", "fsi", "fsx"]
R = ["r"]
Perl = ["pl", "pm"]
Elixir = ["ex", "exs"]
Erlang = ["erl", "hrl"]
Haskell = ["hs", "lhs"]
Dart = ["dart"]
Protocol = ["proto", "graphql", "gql"]
Assembly = ["s", "asm"]
CMake = ["cmake"]
Patch = ["patch", "diff"]

[source_names]
Build = ["makefile", "gnumakefile", "justfile", "dockerfile", "containerfile", "jenkinsfile"]

[source_name_prefixes]
Build = ["dockerfile.", "containerfile."]
